<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06070a">
<title>Pokémon Shorts Arena</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--s:1;--font:Impact,'Arial Black','Haettenschweiler',system-ui,sans-serif;--blue:#3b82f6;--red:#ef4444;--gold:#facc15;--mute:#94a3b8;--panel:#0f172a}
html,body{height:100%;background:#06070a;color:#fff;font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;border:0;cursor:pointer;letter-spacing:1.2px;text-transform:uppercase}
button:disabled{cursor:not-allowed;opacity:.45}

/* Fixed 420x760 (9:16) design, scaled to fit any screen */
#stage{position:relative;width:calc(420px*var(--s));height:calc(760px*var(--s))}
#app{position:absolute;top:0;left:0;width:420px;height:760px;transform:scale(var(--s));transform-origin:0 0;overflow:hidden;
  background:radial-gradient(circle at center,#161b2e,#07090e);border:3px solid #23283c;border-radius:20px;box-shadow:0 20px 50px #000e,0 0 30px #3b82f633}
body.full #app{border:0;border-radius:0;box-shadow:none}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .25s,transform .25s}
.screen.hidden,.modal.hidden,#toast.hidden{opacity:0;pointer-events:none}
.screen.hidden{transform:scale(.97)}

/* Selection */
.sel-head{padding:12px 14px 4px;text-align:center}
.sel-head h1{font-size:19px;letter-spacing:2px;background:linear-gradient(90deg,#38bdf8,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent}
.sel-head p{font-size:10px;letter-spacing:1px;color:var(--mute);margin-top:2px}
.preview{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 14px 8px}
.pcard{height:52px;border-radius:8px;padding:3px 6px;display:flex;align-items:center;gap:6px;background:#0f172ad9;border:2px dashed #fff3;transition:.2s}
.pcard.blue.on{border:2px solid var(--blue);background:linear-gradient(135deg,#1e3a8a99,#0f172ae6);box-shadow:0 0 14px #3b82f666}
.pcard.red.on{border:2px solid var(--red);background:linear-gradient(135deg,#991b1b99,#0f172ae6);box-shadow:0 0 14px #ef444466}
.thumb{width:42px;height:42px;border-radius:6px;background:#0006;display:grid;place-items:center;font-size:11px;color:#64748b;flex:none}
.thumb img{width:100%;height:100%;object-fit:contain}
.pmeta{display:flex;flex-direction:column;min-width:0}
.ptag{font-size:8px;letter-spacing:1px}.ptag.blue{color:#60a5fa}.ptag.red{color:#f87171}
.pname{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{font-size:13px;color:var(--gold);text-shadow:0 0 8px #facc1599}
.grid{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:4px;width:390px;height:390px;margin:0 auto;padding:6px;background:#0006;border-radius:12px;border:2px solid #283049}
.slot{position:relative;border-radius:6px;background:#111625;border:1px solid #ffffff14;display:grid;place-items:center;overflow:hidden;transition:transform .1s,box-shadow .15s}
.slot.pick{cursor:pointer}
.slot.pick:hover{transform:scale(1.08);border-color:#fff6;z-index:2}
.slot img{width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 2px 4px #000c);pointer-events:none}
.slot.locked{background:#090c15;opacity:.35;color:#475569;font-size:14px}
.slot.sb{border:2px solid var(--blue);background:radial-gradient(circle,#3b82f659,#0f172a);box-shadow:0 0 10px #3b82f6cc}
.slot.sr{border:2px solid var(--red);background:radial-gradient(circle,#ef444459,#0f172a);box-shadow:0 0 10px #ef4444cc}
.slot.sm{border:2px solid #a855f7;background:linear-gradient(135deg,#3b82f666,#ef444466);box-shadow:0 0 14px #a855f7e6}
.badge{position:absolute;top:1px;left:1px;font-size:8px;padding:1px 3px;border-radius:3px;line-height:1;background:var(--blue)}
.badge.r{background:var(--red)}.badge.m{background:#a855f7}
.sel-foot{margin-top:auto;padding:8px 16px 14px;display:flex;flex-direction:column;gap:6px}
.btn{width:100%;padding:9px;border-radius:9px;background:#1e293b;font-size:12px;transition:transform .15s}
.btn:not(:disabled):hover{transform:scale(1.015)}
#matrixBtn:not(:disabled){background:linear-gradient(90deg,#059669,#0284c7);box-shadow:0 0 14px #05966966}
#testBtn:not(:disabled){background:linear-gradient(90deg,#8b5cf6,#ec4899);box-shadow:0 0 14px #8b5cf666}
#startBtn{padding:12px;font-size:14px;letter-spacing:2px}
#startBtn:not(:disabled){background:linear-gradient(90deg,var(--blue),var(--red));box-shadow:0 0 20px #3b82f680,0 0 30px #ef444466;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.hint{text-align:center;font-size:9px;color:var(--mute);letter-spacing:.5px}

/* Arena */
#arenaScreen{justify-content:space-evenly}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:13px;letter-spacing:2px;background:linear-gradient(90deg,#3b82f659,#ef444459);border-bottom:2px solid #ffffff1a}
.topbar span{font-size:10px;background:#0009;padding:2px 6px;border-radius:5px;border:1px solid #fff3;font-family:monospace;letter-spacing:.5px}
.arena-wrap{width:390px;height:390px;margin:0 auto;border:3px solid #3b425b;border-radius:12px;overflow:hidden;box-shadow:0 8px 25px #0009;flex:none}
#battleCanvas{display:block;width:100%;height:100%}
#ticker{margin:0 12px;min-height:26px;padding:5px 8px;border-radius:7px;background:#0009;border:1px solid #ffffff14;color:var(--gold);font-size:10.5px;letter-spacing:.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}
.fcard{padding:6px 8px;border-radius:8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.fcard.blue{background:linear-gradient(145deg,#1d4ed859,#050f23bf);border:2px solid var(--blue)}
.fcard.red{background:linear-gradient(145deg,#b91c1c59,#280505bf);border:2px solid var(--red)}
.ftitle{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:11.5px}
.evo{font-size:8px;padding:1px 4px;border-radius:4px;background:#000b;color:#fef08a;border:1px solid #facc154d;white-space:nowrap}
.move{background:#0008;border-radius:4px;padding:2px 5px;font-size:8.5px;display:flex;justify-content:space-between;gap:4px;border:1px solid #ffffff1a;white-space:nowrap;overflow:hidden}
.move.locked{opacity:.4;font-style:italic}
.foot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 12px 10px}
.foot .btn{font-size:10.5px;padding:9px 4px;border:1px solid #fff3;color:#cbd5e1}
#recBtn{color:#fff;background:#3f1d1d;border-color:#ef444480}
#recBtn.on{background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}

/* Modal */
.modal{position:absolute;inset:0;z-index:60;background:#04060ceb;backdrop-filter:blur(6px);display:flex;padding:12px;transition:opacity .2s}
.mcard{flex:1;background:#0d121f;border:2px solid #2e3852;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#0f172ad9;border-bottom:1px solid #ffffff1a}
.mhead h2{font-size:13px;letter-spacing:1.5px;color:var(--gold)}
.mhead p{font-size:8.5px;color:var(--mute);margin-top:1px}
.x{background:none;font-size:22px;color:var(--mute);line-height:1}
.mbody{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.mfoot{padding:7px 12px;border-top:1px solid #ffffff14}
.row{background:#131a2bd9;border:1px solid #ffffff14;border-radius:8px;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.seed{font-size:8px;color:#a78bfa;font-family:monospace}
.res{font-size:10.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.w.blue{color:#60a5fa}.w.red{color:#f87171}
.hp{border:1px solid #22c55e;color:#4ade80;background:#22c55e33;font-size:8.5px;padding:0 3px;border-radius:4px;font-family:monospace}
.l{color:var(--mute);text-decoration:line-through;opacity:.75}
.watch{background:linear-gradient(90deg,var(--blue),#6366f1);border-radius:6px;font-size:9.5px;padding:5px 8px}
.mtop{border:1px solid #38bdf8;border-radius:8px;padding:8px 10px;text-align:center;background:linear-gradient(135deg,#1e293be6,#0f172af2)}
.big{font-size:20px;color:#38bdf8;letter-spacing:1px}
.mrow{display:flex;flex-direction:column;gap:3px;background:#131a2bd9;border:1px solid #ffffff14;border-radius:7px;padding:5px 8px;font-size:10px}
.mrow>div:first-child{display:flex;justify-content:space-between}
.track{height:7px;background:var(--red);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#60a5fa)}
.loading{text-align:center;color:#38bdf8;padding:35px 0;font-size:12px}

#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:100}
#toast{position:absolute;left:12px;right:12px;bottom:14px;z-index:80;background:#0d121ff5;border:2px solid var(--red);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:11px;letter-spacing:.5px;transition:opacity .2s}
#toast .acts{display:flex;gap:6px}
#toast .acts button{flex:1;padding:8px;border-radius:7px;background:#1e293b;font-size:10.5px}
#toast .acts button.main{background:linear-gradient(90deg,var(--blue),var(--red))}
.rec-canvas{position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1} /* on-screen (tiny) so mobile browsers keep painting it for capture */
</style>
</head>
<body>
<div id="stage"><div id="app">
  <div id="flash"></div>

  <div class="modal hidden" id="modal"><div class="mcard">
    <div class="mhead"><div><h2 id="mTitle"></h2><p id="mSub"></p></div><button class="x" id="mClose">&times;</button></div>
    <div class="mbody" id="mBody"></div>
    <div class="mfoot"><button class="btn" id="mAgain"></button></div>
  </div></div>

  <!-- SELECT -->
  <section class="screen" id="selectScreen">
    <div class="sel-head"><h1>CHOOSE YOUR FIGHTERS</h1><p>TAP 1: BLUE • TAP 2: RED (TAP SAME TWICE FOR MIRROR)</p></div>
    <div class="preview">
      <div class="pcard blue" id="pvBlue"><div class="thumb" id="thBlue">1P</div><div class="pmeta"><span class="ptag blue">BLUE TEAM</span><span class="pname" id="nmBlue">SELECT FIGHTER</span></div></div>
      <div class="vs">VS</div>
      <div class="pcard red" id="pvRed"><div class="thumb" id="thRed">2P</div><div class="pmeta"><span class="ptag red">RED TEAM</span><span class="pname" id="nmRed">SELECT FIGHTER</span></div></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="sel-foot">
      <button class="btn" id="matrixBtn" disabled>📊 100-BATTLE WIN RATE MATRIX</button>
      <button class="btn" id="testBtn" disabled>🧪 TEST BATTLES (10 SEEDS + REPLAY)</button>
      <button class="btn" id="startBtn" disabled>START COMBAT</button>
      <div class="hint" id="hint">Tap a Pokémon to select for BLUE (1P)</div>
    </div>
  </section>

  <!-- ARENA -->
  <section class="screen hidden" id="arenaScreen">
    <div class="topbar"><span id="seedTag">SEED #------</span><div>AUTONOMOUS ARENA</div><span id="timer">00:00</span></div>
    <div class="arena-wrap"><canvas id="battleCanvas"></canvas></div>
    <div id="ticker">⚔️</div>
    <div class="hud">
      <div class="fcard blue"><div class="ftitle"><span id="p1Name">-</span><span class="evo" id="p1Evo">-</span></div><div class="move" id="p1M1"></div><div class="move" id="p1M2"></div></div>
      <div class="fcard red"><div class="ftitle"><span id="p2Name">-</span><span class="evo" id="p2Evo">-</span></div><div class="move" id="p2M1"></div><div class="move" id="p2M2"></div></div>
    </div>
    <div class="foot">
      <button class="btn" id="backBtn">◀ Back</button>
      <button class="btn" id="newBtn">🎲 New fight</button>
      <button class="btn" id="recBtn">● Rec</button>
    </div>
  </section>

  <div id="toast" class="hidden"><div id="toastMsg"></div><div class="acts" id="toastActs">
    <button class="main" id="tSave">⬇ Save video</button><button id="tShare">↗ Share</button><button id="tClose">✕</button>
  </div></div>
</div></div>

<script>
'use strict';
/* =====================================================================
   1. UTILITIES, RULES & DETERMINISTIC RNG
   ===================================================================== */
const TAU = Math.PI * 2, D2R = Math.PI / 180, STEP = 1 / 60, MAX_TIME = 80, RS = 2, TILE = 30;
const EVO_WAIT = .75, MOVE_LOCK = 1, EVO_IFRAMES = .6;          // universal rules
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
const angTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
const wrapAng = a => { while (a < -Math.PI) a += TAU; while (a > Math.PI) a -= TAU; return a; };
// a target that can't currently be hit/targeted
const busy = t => !t || t.absent || t.inDoor || t.isDead || t.isUnderground || t.inSuplex || t.inDrillRun || t.isWrapped || t.cinematic || t.sprouting || t.airborne;
// universal: no moves during the 1s lock (match start / after evolving) or while waiting to evolve
const acting = f => !(f.moveLock > 0) && !f.pendingEvo;
const bodyOf = t => (t && t.__body) || t;           // resolve a team "view" to the actual unit being hit
function mulberry32(seed) { let s = (seed >>> 0) || 1; return () => { let t = (s += 0x6D2B79F5); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let R = Math.random;                                  // every gameplay random roll goes through R()
function leadAngle(from, t, flight, maxDeg) {
  const direct = angTo(from, t);
  const pred = Math.atan2(t.y + (t.vy || 0) * flight * 60 - from.y, t.x + (t.vx || 0) * flight * 60 - from.x);
  return direct + clamp(wrapAng(pred - direct), -maxDeg * D2R, maxDeg * D2R);
}
// guard = immune (Tyrogue's charges); Ekans/Arbok can't be crowd-controlled while wrapping
function stun(t, sec) { if (t.guard || t.isWrapping) return; t.prevVx = t.vx; t.prevVy = t.vy; t.stunTimer = sec; t.vx = 0; t.vy = 0; }
// Hydro Snipe: exponential curve through 1s→50, 2s→100, 3s→250  (D = 25/3 · 3^t + 25); below 1s it never fires
const snipeDamage = c => c < 1 ? 0 : Math.round(75 * Math.pow(2, Math.min(3, c) - 1)); // exponential: 1s→75, 2s→150, 3s→300 (doubles every second)
const MIRROR = new Set(['spidops', 'excadrill', 'voltorb', 'koffing', 'kadabra', 'toxtricityLowkey', 'porygon2', 'hitmonlee']); // sprites drawn mirrored so they face the foe
const SPRITE_SCALE = { hitmonchan: 1.1, toxtricity: 1.1, toxtricityLowkey: 1.1 }; // drawn a bit bigger (visual only)
// Speech bubbles (Meowth's catchphrase, hidden rival quotes): typewriter text above a fighter
function say(f, text, dur = 3) { f.speech = { full: text, shown: '', i: 0, tw: 0, t: dur }; }
function tickSpeech(f, dt) { const s = f.speech; s.t -= dt; s.tw += dt; while (s.tw >= .07 && s.i < s.full.length) { s.tw -= .07; s.shown = s.full.slice(0, ++s.i); } if (s.t <= 0) f.speech = null; }
const poisonImmune = p => p.id === 'zangoose' && p.hp <= 300; // Zangoose's hidden Rage perk
const nearest = (list, from) => { let best = null, bd = 1e9; for (const u of list) { if (u.isDead) continue; const d = Math.hypot(u.x - from.x, u.y - from.y); if (d < bd) { bd = d; best = u; } } return best; };

/* Multi-unit teams (Metagross swarm, Plusle & Minun): an opponent's move code sees the team through a
   "view" that always points at the unit nearest to the attacker. Reads/writes of these keys go to that unit. */
const UNIT_KEYS = new Set(['x', 'y', 'vx', 'vy', 'prevVx', 'prevVy', 'radius', 'speed', 'hp', 'maxHp', 'name', 'stage', 'spriteKey', 'stunTimer',
  'trappedTimer', 'trappedTick', 'poisonTimer', 'poisonTick', 'isReeling', 'isWrapped', 'inSuplex', 'knockTimer', 'invincibleTimer', 'inToxicGas',
  'facingRight', 'drawScale', 'drawAlpha', 'blinkTimer', 'weaveAnchor', 'grief', 'immobile', 'leechSeeds', 'leechT', 'leechSrc', 'seedSpots',
  'venomStacks', 'venomTimer', 'venomTick', 'shedT', 'decoy', 'speech', 'tint', 'knockFriction', 'slideOnHit', 'anchored', 'sprouting', 'gasExitTick', 'gasTick',
  'frozenT', 'frozenMax', 'noContactT', 'burnLeft', 'burnTick', 'burnDmg', 'burnInt', 'guard', 'momentum', 'drawRot', 'airborne', 'knockTimer',
  'inDoor', 'doorCd', 'darkness', 'tpoisonT', 'tpoisonTick', 'spikeCd']);
function makeView(T, a) {
  return new Proxy(T, {
    get(t, k) {
      const f = t._focus;
      if (k === '__body') return f || null;
      if (k === 'absent') return !f;
      if (k === 'takeDamage') return (amt, _a, o) => f ? a.applyDamage(f, amt, o) : 0;
      if (f && UNIT_KEYS.has(k)) return f[k];
      return t[k];
    },
    set(t, k, v) { const f = t._focus; if (f && UNIT_KEYS.has(k)) f[k] = v; else t[k] = v; return true; }
  });
}

/* =====================================================================
   2. SOUND + MUSIC (procedural Web Audio; routed to speakers AND the recorder)
   ===================================================================== */
const TONES = {
  punch: ['triangle', 170, 35, .07, .35], dash: ['sine', 280, 850, .2, .3], slam: ['sawtooth', 90, 15, .4, .7], snipe: ['sine', 1200, 100, .35, .5],
  sting: ['sawtooth', 650, 120, .1, .3], poison: ['sine', 420, 180, .08, .15], drill: ['sawtooth', 320, 750, .18, .35],
  bounce: ['sine', 220, 80, .06, .2], splatter: ['sawtooth', 320, 20, .6, .9], webAnchor: ['triangle', 320, 780, .08, .25], webLock: ['sawtooth', 880, 440, .15, .3],
  webHit: ['square', 240, 80, .1, .35], boneThrow: ['triangle', 480, 180, .14, .35], boneHit: ['square', 320, 110, .09, .4], boneCatch: ['sine', 520, 880, .12, .35],
  boneRush: ['sawtooth', 180, 620, .22, .55], dig: ['sawtooth', 140, 45, .2, .4], trap: ['sine', 300, 60, .35, .5], slash: ['triangle', 750, 120, .12, .45],
  pin: ['triangle', 850, 320, .08, .3], pinHit: ['sawtooth', 450, 140, .08, .35], zap: ['sawtooth', 950, 150, .25, .45], select: ['sine', 440, 880, .08, .2],
  wrap: ['sawtooth', 210, 75, .2, .3], glare: ['square', 660, 220, .3, .4], flash: ['sawtooth', 720, 180, .22, .4], meteor: ['sine', 180, 950, .4, .6],
  sludge: ['sine', 140, 480, .09, .35], splash: ['triangle', 250, 620, .15, .35], wave: ['sawtooth', 110, 30, .45, .7], coin: ['sine', 987, 1318, .12, .25],
  bazooka: ['sawtooth', 180, 750, .28, .45], snip: ['square', 680, 180, .08, .35], sonic: ['sawtooth', 120, 880, .25, .5],
  bubble: ['sine', 500, 1300, .09, .18], flap: ['triangle', 520, 950, .07, .14], bonk: ['square', 170, 70, .12, .3], mail: ['sine', 880, 1480, .12, .2], pop: ['sine', 1100, 300, .07, .28], evoCharge: ['sine', 300, 1400, .75, .12], grab: ['square', 220, 110, .15, .35],
  hand: ['triangle', 600, 900, .12, .22], charge: ['sawtooth', 80, 700, 1, .15], water: ['triangle', 400, 200, .12, .2],
  drill0: ['sawtooth', 170, 210, .11, .05], drill1: ['sawtooth', 300, 370, .11, .06], drill2: ['sawtooth', 520, 660, .11, .07],
  seed: ['triangle', 900, 500, .05, .14], leech: ['sine', 300, 650, .15, .2], claw: ['sawtooth', 1500, 350, .1, .3], drip: ['sine', 1200, 600, .06, .18],
  fang: ['sawtooth', 1300, 420, .14, .22], node: ['square', 660, 990, .08, .12], glitch: ['square', 120, 1800, .3, .1], freeze: ['sine', 2200, 900, .25, .2], shatter: ['triangle', 2600, 400, .3, .22], uppercut: ['sawtooth', 220, 900, .12, .3], alert: ['square', 1320, 1320, .08, .12], hiss: ['square', 2400, 1800, .25, .06], equip: ['triangle', 520, 1040, .12, .2], chop: ['square', 260, 90, .07, .3], rockThrow: ['sawtooth', 300, 1400, .12, .3],
  teleport: ['sine', 1500, 260, .2, .22], psy: ['sine', 280, 620, .5, .1], psywave: ['triangle', 420, 1500, .3, .16], spoon: ['triangle', 1800, 900, .08, .2],
  yarn: ['triangle', 320, 200, .08, .22], meow: ['triangle', 700, 1100, .14, .16], caught: ['square', 880, 1320, .08, .12]
};
const sfx = {
  ctx: null, out: null, recDest: null, muted: false, jaws: false,
  init() {
    if (this.ctx || typeof window === 'undefined') return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ctx = new AC({ sampleRate: 48000 }); } catch (e) { this.ctx = new AC(); } // 48 kHz = what MP4/WebM audio encoders expect (avoids pitch/garble in recordings)

/* =====================================================================
   4. FIGHTERS
   fighter() supplies shared state. update(dt, target, arena) is only called while acting()
   unless the fighter sets alwaysUpdate (then it gates its own moves with acting(this)).
   takeDamage(amount, arena, {silent}) returns the damage actually dealt.
   ===================================================================== */
function fighter(id, team, props) {
  return Object.assign({
    id, team, stage: 1, hp: 1000, maxHp: 1000, isDead: false, x: 0, y: 0, vx: 0, vy: 0, facingRight: true,
    invincibleTimer: 0, poisonTimer: 0, trappedTimer: 0, stunTimer: 0, prevVx: 0, prevVy: 0, moveLock: 0, pendingEvo: null,
    update() {}, getHUD() { return {}; }
  }, props);
}
// Universal rule: when a condition is met, wait 0.75s without using moves, then evolve (blink i-frames + 1s move lock)
function requestEvolve(f, a, form, msg, after, force) {
  if (f.pendingEvo || f.isDead || (f.devolvedT > 0 && !force)) return; // a devolved fighter only re-evolves when its 5s run out
  f.pendingEvo = { t: EVO_WAIT, form, msg, after };
  sfx.play('evoCharge'); a.event(`✨ ${f.name} IS EVOLVING...`);
}
// Tooltip rule: damage when a move is ready, its cooldown while recharging, USED for one-time moves
const rdy = (cd, txt) => cd > .05 ? `${cd.toFixed(1)}s` : txt;
const hud = (f, evo, m1Name, m1Dmg, m2Name, m2Detail, m2Locked) => ({ name: f.name, evo, m1Name, m1Dmg, m2Name, m2Detail, m2Locked });

// 1. CHARIZARD — flamethrower ticks; one-time Seismic Toss (grab → fly up → circle → slam)
const createCharizard = team => fighter('charizard', team, {
  name: 'CHARMANDER', spriteKey: 'charmander', radius: 31, speed: 3.39,
  fireCd: 0, breathing: false, fireDur: 0, fireTick: 0, tossCd: 0, inSuplex: false, tossT: 0, tossUsed: false, grab: null,
  checkEvolution(a) {
    if (this.stage === 1 && this.hp <= 750) requestEvolve(this, a, { stage: 2, name: 'CHARMELEON', spriteKey: 'charmeleon', radius: 35, speed: 3.70 }, '🔥 CHARMELEON EVOLVED! 🔥');
    else if (this.stage === 2 && this.hp <= 500) requestEvolve(this, a, { stage: 3, name: 'CHARIZARD', spriteKey: 'charizard', radius: 42, speed: 4.16, tossCd: 0 }, '🐉 CHARIZARD AWAKENED! SEISMIC TOSS UNLOCKED! 🐉');
  },
  startToss(t, a) {
    const g = bodyOf(t), S = a.size;
    this.grab = g; this.inSuplex = g.inSuplex = true; this.tossT = 0; this.breathing = false; this.drawTop = true; this.whooshed = false;
    this.sx = this.x; this.sy = this.y; this.gsx = g.x; this.gsy = g.y;
    this.tear = { x: clamp(g.x, 70, S - 70), y: clamp(g.y, 150, S - 40) }; // tip of the teardrop = where the slam lands
    sfx.play('grab'); if (!a.headless) music.toss();
    a.event(`🌪️ CHARIZARD GRABBED ${g.name}! SEISMIC TOSS! 🌪️`);
  },
  tossFrame(dt, a) { // grab → leap up 25° right → U-turn high in the air → dive back down from 25° left and slam (a teardrop-shaped path)
    const g = this.grab, P = this.tear;
    if (!g || g.isDead) return this.endToss(a, false);
    this.tossT = Math.min(1, this.tossT + dt / 2.4);
    const p = this.tossT, L = 170, c25 = Math.cos(25 * D2R), s25 = Math.sin(25 * D2R);
    let s = 1, al = 1, tx, ty;
    if (p < .1) { // grab: Charizard swoops onto the foe and both slide to the launch point
      const k = p / .1, e = k * (2 - k);
      tx = this.gsx + (P.x - this.gsx) * e; ty = this.gsy + (P.y - this.gsy) * e;
      this.x = this.sx + (tx - this.sx) * e; this.y = this.sy + (ty - 16 - this.sy) * e;
    } else if (p < .92) { // cubic Bézier P → (P + 25°-right·L) → (P + 25°-left·L) → P : leaves up-right, returns diving from the upper left
      const k = (p - .1) / .82, e = k * k * (3 - 2 * k), u = 1 - e;
      const rx = P.x + s25 * L, ry = P.y - c25 * L, lx = P.x - s25 * L, ly = P.y - c25 * L;

      this.facingRight = g.facingRight = k < .5;
      if (!this.whooshed) { this.whooshed = true; sfx.play('whoosh'); }
      if (Math.random() < .5) { a.fx({ type: 'afterimage', spriteKey: g.spriteKey, flip: g.facingRight, x: tx, y: ty, radius: g.radius * s, life: .2 }); a.fx({ type: 'afterimage', spriteKey: this.spriteKey, flip: this.facingRight, x: tx, y: ty - 16 * s, radius: this.radius * s, life: .2 }); }
    } else { tx = P.x; ty = P.y; } // impact
    if (p >= .1) { this.x = tx; this.y = ty - 16 * s; }
    g.x = tx; g.y = ty;
    this.drawScale = g.drawScale = s; this.drawAlpha = g.drawAlpha = al;

  endToss(a, hit) {

    if (g) { g.inSuplex = false; g.drawScale = g.drawAlpha = 1; }
    if (!hit || !g || g.isDead) return;
    g.takeDamage(200, a); sfx.play('slam'); a.screenShake = 18; a.ring(g.x, g.y, 100, '#f97316');
    for (let i = 0; i < 16; i++) { const d = R() * TAU, s = 2 + R() * 4; a.fx({ type: 'dot', x: g.x, y: g.y + 10, vx: Math.cos(d) * s, vy: Math.sin(d) * s * .5, radius: 3 + R() * 3, color: '#a8a29e', life: .6 }); }
    const g1 = R() * TAU; a.knock(this, g1, 5.85, .3); a.knock(g, g1 + Math.PI * (.5 + R()), 5.85, .3); // both tumble away in random directions

        const o = via.d.other, left = range - via.t, g = bodyOf(t), gd = Math.hypot(g.x - o.x, g.y - o.y), off = Math.abs(wrapAng(Math.atan2(g.y - o.y, g.x - o.x) - ang));

});

// 2. LUCARIO — contact punch combos; Extreme Speed state (3s, 3x speed, 150 dmg + violent knockback on contact)
const createLucario = team => fighter('lucario', team, {
  name: 'RIOLU', spriteKey: 'riolu', radius: 29, speed: 3.70,
  punchCount: 0, inCombo: false, comboHits: 0, comboTimer: 0, comboCd: 0, esActive: false, esTimer: 0, esCd: 0, esAfter: 0,
  checkEvolution(a) { if (this.stage === 1 && this.punchCount >= 9) requestEvolve(this, a, { stage: 2, name: 'LUCARIO', spriteKey: 'lucario', radius: 35, speed: 4.31, esCd: 0 }, '⚡ LUCARIO EVOLVED! EXTREME SPEED UNLOCKED! ⚡'); },
  canMash() { return !this.esActive && this.esAfter <= 0 && !this.inCombo && this.comboCd <= 0; }, // no Meteor Mash during ES or 0.5s after
  startCombo(t) { if (this.canMash() && !busy(t)) { this.inCombo = true; this.comboHits = 3; this.comboTimer = 0; } },
  endES() {

  },

/* =====================================================================
   7. UI: selection, test lab, matrix, HUD, main loop, responsive scaling
   ===================================================================== */
const $ = id => document.getElementById(id);
let arena, sel = { b: null, r: null };

function buildGrid() {
  const grid = $('grid');
  grid.innerHTML = Array.from({ length: 64 }, (_, i) => i < ROSTER.length
    ? `<div class="slot pick" data-i="${i}"><img src="${ROSTER[i].sprite}" alt="${ROSTER[i].name}"></div>` : '<div class="slot locked">?</div>').join('');
  grid.onclick = e => { const s = e.target.closest('.pick'); if (s) pick(+s.dataset.i); };
}
function pick(i) {
  sfx.init(); sfx.play('select');
  const { b, r } = sel;
  if (ROSTER[i].manual && ((b === i && r === null) || (b !== null && b !== i && ROSTER[b].manual))) { $('hint').textContent = '🎮 Manual fighters can\'t mirror or face each other'; return; }
  if (b === null) sel.b = i;
  else if (b === i && r === null) sel.r = i;
  else if (b === i && r === i) sel.r = null;
  else if (r === null) sel.r = i;
  else if (b === i) sel.b = null;
  else if (r === i) sel.r = null;
  else sel.r = i;

}
function renderSelection() {
  document.querySelectorAll('.pick').forEach(el => {
    const i = +el.dataset.i, isB = sel.b === i, isR = sel.r === i;
    el.classList.toggle('sm', isB && isR); el.classList.toggle('sb', isB && !isR); el.classList.toggle('sr', isR && !isB);
    el.querySelector('.badge')?.remove();
    if (isB || isR) el.insertAdjacentHTML('beforeend', `<div class="badge ${isB && isR ? 'm' : isR ? 'r' : ''}">${isB && isR ? '1P & 2P' : isB ? '1P' : '2P'}</div>`);
    if (ROSTER[i].manual && !el.querySelector('.pad')) el.insertAdjacentHTML('beforeend', '<div class="pad" style="position:absolute;right:1px;bottom:0;font-size:9px">🎮</div>');
  });
  for (const [k, side, ph] of [['b', 'Blue', '1P'], ['r', 'Red', '2P']]) {
    const i = sel[k];
    $('pv' + side).classList.toggle('on', i !== null);
    $('th' + side).innerHTML = i !== null ? `<img src="${ROSTER[i].sprite}" alt="">` : ph;
    $('nm' + side).textContent = i !== null ? ROSTER[i].name : 'SELECT FIGHTER';
  }
  const both = sel.b !== null && sel.r !== null, manual = [sel.b, sel.r].some(i => i !== null && ROSTER[i].manual);
  $('startBtn').disabled = !both; $('testBtn').disabled = !both || manual;
  $('matrixBtn').disabled = sel.b === null || manual; // a player-controlled fighter can't be simulated
  $('hint').textContent = manual && both ? '🎮 MANUAL FIGHTER: CLICK/TAP THE ARENA TO SCRATCH!' : manual ? '🎮 Manual fighter — Start Combat only (no sims)' : both ? (sel.b === sel.r ? '⚔️ MIRROR MATCH READY!' : '🔥 BOTH FIGHTERS READY!')

let modalAgain = null, matrixToken = 0;
function openModal(title, sub, againLabel, again) {
  $('mTitle').textContent = title; $('mSub').textContent = sub; $('mAgain').textContent = againLabel; modalAgain = again; $('modal').classList.remove('hidden');
}
function closeModal() { $('modal').classList.add('hidden'); matrixToken++; }
const randomSeed = () => Math.floor(100000 + Math.random() * 900000);

function runTests() {
  openModal('SIMULATION LAB (10 SEEDS)', 'PRE-SIMULATED — TAP WATCH TO REPLAY ANY FIGHT', '🎲 Reroll 10 seeds', runTests);
  $('mBody').innerHTML = '<div class="loading">⚡ SIMULATING 10 BATTLES...</div>';
  setTimeout(() => {
    $('mBody').innerHTML = Array.from({ length: 10 }, () => {
      const r = simulate(sel.b, sel.r, randomSeed());
      return `<div class="row"><div><div class="seed">SEED #${r.seed} • ${r.dur}s${r.timeout ? ' • TIME' : ''}</div>
        <div class="res"><span class="w ${r.winnerTeam}">🏆 ${r.winnerName}</span><span class="hp">${r.winnerHp} HP</span><span class="l">${r.loserName}</span></div></div>
        <button class="watch" data-seed="${r.seed}">▶ WATCH</button></div>`;

}
async function runMatrix() {
  const token = ++matrixToken, body = $('mBody'), B = sel.b, vsOne = sel.r !== null;
  const opps = vsOne ? [sel.r] : ROSTER.map((_, i) => i).filter(i => !ROSTER[i].manual);
  openModal(vsOne ? '100-BATTLE HEAD-TO-HEAD' : `ROSTER MATRIX: ${ROSTER[B].name}`,
    vsOne ? `${ROSTER[B].name} VS ${ROSTER[sel.r].name} (100 SEEDS)` : `100 SEEDS VS ALL ${opps.length} (${opps.length * 100} BATTLES)`, '⚡ Re-run', runMatrix);

    await new Promise(r => setTimeout(r, 0));
    if (token !== matrixToken) return;
    let wins = 0;
    for (let s = 1; s <= 100; s++) if (simulate(B, o, 300000 + o * 100 + s).winnerTeam === 'blue') wins++;

    ? `<div class="mtop"><div style="font-size:10px;color:#94a3b8">100 MATCH RESULT</div><div class="big">${total}% <span style="font-size:12px;color:#94a3b8">VS</span> ${100 - total}%</div>
        <div style="display:flex;justify-content:space-between;font-size:10px;margin-top:4px"><span style="color:#60a5fa">${ROSTER[B].name}: ${total} W</span><span style="color:#f87171">${results[0].name}: ${100 - total} W</span></div></div>`

function setHTML(el, html) { if (el._h !== html) { el._h = html; el.innerHTML = html; } }
function updateHUD() {
  for (const [p, f] of [['p1', arena.blue], ['p2', arena.red]]) {

    if (f.pendingEvo) h.evo = '✨ EVOLVING...'; else if (f.devolvedT > 0) h.evo = `DEVOLVED ${(DEVO_T - f.devolvedT).toFixed(1)}/${DEVO_T}s`;
    setHTML($(p + 'Name'), h.name); setHTML($(p + 'Evo'), h.evo);
    setHTML($(p + 'M1'), `<span>${h.m1Name}</span><span>${h.m1Dmg}</span>`);
    setHTML($(p + 'M2'), `<span>${h.m2Name}</span><span>${h.m2Detail}</span>`);
    $(p + 'M2').classList.toggle('locked', !!h.m2Locked);

function startFight(seed) {

  b.disabled = !(ex || Rec.supported);
  b.title = ex ? 'Renders this whole fight (0:00 → 3s after the KO) into a perfectly synced MP4' : Rec.supported ? 'Replays this fight from 0:00 and records it until 3s after the KO' : 'Recording is not supported in this browser';

      if (arena.manualMatch && !arena.over) { startFight(arena.seed); Rec.armed = true; updateRecBtn(); return showToast('🎬 Play the fight — the video renders automatically 3s after the KO.', false); }
      return Rec.exportFight(arena.bi, arena.ri, arena.seed, arena.manualMatch ? arena.inputLog.slice() : null); // deterministic: re-render the whole fight off-screen

  document.addEventListener('visibilitychange', () => { if (document.hidden && Rec.active) showToast('⚠️ Keep this tab visible while recording — browsers pause animation in background tabs.', false); });

if (typeof document !== 'undefined' && document.getElementById && document.getElementById('app')) init();
