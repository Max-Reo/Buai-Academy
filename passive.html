<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passive Voice Challenge</title>
    <style>
        :root {
            --team1: #FF595E;
            --team2: #1982C4;
            --team3: #8AC926;
            --team4: #FFCA3A;
            --team5: #6A4C93;
            --team6: #FF924C;
            --bg-color: #1e1e24;
            --text-light: #f5f5f5;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-light);
            height: 100vh; overflow: hidden;
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
            user-select: none;
        }

        .game-container { display: flex; height: 65vh; padding: 20px 40px; box-sizing: border-box; gap: 20px; }
        .side-panel { width: 20%; display: flex; flex-direction: column; justify-content: space-between; gap: 15px; }
        .middle-panel { width: 60%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px; text-align: center; }

        .team-card {
            background: #333; border-radius: 12px; padding: 15px; text-align: center;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.3s, opacity 0.3s;
            border: 3px solid transparent; opacity: 0.6; flex: 1; display: flex; flex-direction: column; justify-content: center;
        }
        .team-card h2 { margin: 0 0 5px 0; font-size: 22px; }
        .team-card .score { font-size: 32px; font-weight: bold; }
        .team-card:hover { transform: scale(1.03); opacity: 0.9;}

        .team1 { border-color: var(--team1); color: var(--team1); }
        .team2 { border-color: var(--team2); color: var(--team2); }
        .team3 { border-color: var(--team3); color: var(--team3); }
        .team4 { border-color: var(--team4); color: var(--team4); }
        .team5 { border-color: var(--team5); color: var(--team5); }
        .team6 { border-color: var(--team6); color: var(--team6); }

        .team-card.active { transform: scale(1.05); opacity: 1; box-shadow: 0 0 20px currentColor; background: #222; }
        .team-card.played { opacity: 0.2; pointer-events: none; filter: grayscale(80%); }

        .round-info { font-size: 20px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; }
        
        .prompt-box {
            background: #2b2b36; padding: 20px 30px; border-radius: 8px; font-size: 24px;
            margin-bottom: 20px; width: 100%; border-left: 6px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            line-height: 1.4; box-sizing: border-box; min-height: 100px; display: flex; align-items: center; justify-content: center;
        }

        .input-container { width: 100%; position: relative; }
        .input-box {
            width: 100%; min-height: 70px; background: #fff; color: #111; font-size: 28px; padding: 15px 20px;
            border-radius: 8px; display: flex; align-items: center; justify-content: center; word-wrap: break-word;
            box-sizing: border-box; border: 5px solid #444; box-shadow: inset 0 3px 6px rgba(0,0,0,0.2); transition: border-color 0.3s;
        }

        .word-count { margin-top: 15px; font-size: 18px; color: #aaa; font-weight: bold; }
        .word-count.perfect { color: #8AC926; }
        .word-count.error { color: #FF595E; }

        .keyboard-panel {
            height: 35vh; background-color: #25252d; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 10px; box-sizing: border-box; border-top: 5px solid #111;
        }
        .keyboard-row { display: flex; justify-content: center; margin-bottom: 8px; width: 100%; }
        
        .key {
            background: #444; color: white; border: none; border-radius: 8px; padding: 15px 22px; margin: 0 4px;
            font-size: 22px; cursor: pointer; transition: background 0.1s, transform 0.1s; box-shadow: 0 4px 0 #222; flex-grow: 1; max-width: 60px;
        }
        .key:hover { background: #666; }
        .key:active { transform: translateY(4px); box-shadow: 0 0 0 #222; }
        .key.space { max-width: 400px; width: 40%; }
        .key.action { background: #d9534f; max-width: 120px; box-shadow: 0 4px 0 #9c2a27; }
        .key.action:active { box-shadow: 0 0 0 #9c2a27; }
        .key.submit { background: #5cb85c; max-width: 140px; font-weight: bold; box-shadow: 0 4px 0 #3d8b3d; }
        .key.submit:active { box-shadow: 0 0 0 #3d8b3d; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none;
            align-items: center; justify-content: center; z-index: 1000; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: #2b2b36; padding: 40px; border-radius: 12px; text-align: center; max-width: 800px;
            width: 100%; border: 2px solid #555; box-sizing: border-box;
        }
        .modal-content h3 { font-size: 32px; margin-top: 0; color: #fff; }
        .highlight-text { font-size: 28px; color: #FFCA3A; margin: 25px 0; font-style: italic; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px;}
        
        .btn { padding: 15px 30px; font-size: 22px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn:hover { opacity: 0.9; }
        .btn-yes { background: #5cb85c; color: white; }
        .btn-no { background: #d9534f; color: white; }
        .btn-next { background: #1982C4; color: white; }

        #feedback-text { color: white; font-size: 20px; line-height: 1.6; text-align: left; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; margin: 15px 0; }
        .loader { border: 6px solid #444; border-top: 6px solid #FFCA3A; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 900px) {
            body, html { height: auto; overflow-y: auto; }
            .game-container { flex-direction: column; height: auto; padding: 10px; gap: 10px; }
            .side-panel { width: 100%; flex-direction: row; justify-content: center; gap: 8px; }
            .middle-panel { width: 100%; padding: 10px 0; }
            .team-card { padding: 10px 5px; }
            .team-card h2 { font-size: 16px; margin-bottom: 2px; }
            .team-card .score { font-size: 20px; }
            .prompt-box { font-size: 18px; padding: 15px; margin-bottom: 15px; min-height: 60px; }
            .input-box { font-size: 20px; min-height: 50px; padding: 10px; }
            .keyboard-panel { height: auto; padding: 10px 5px; }
            .key { padding: 12px 0; font-size: 16px; margin: 0 2px; max-width: 35px; }
            .key.space { max-width: 150px; }
            .key.action, .key.submit { max-width: auto; font-size: 14px; padding: 12px 10px; }
            .modal-content { padding: 20px; }
            .modal-content h3 { font-size: 24px; }
            .highlight-text { font-size: 20px; margin: 15px 0; }
            .btn { font-size: 16px; padding: 10px 20px; margin: 5px; }
            #feedback-score { font-size: 45px !important; }
            #feedback-text { font-size: 16px !important; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="side-panel left">
            <div class="team-card team1" id="team-1" onclick="activateTeam(1, 'var(--team1)')"><h2>Team 1</h2><div class="score" id="score-1">0</div></div>
            <div class="team-card team2" id="team-2" onclick="activateTeam(2, 'var(--team2)')"><h2>Team 2</h2><div class="score" id="score-2">0</div></div>
            <div class="team-card team3" id="team-3" onclick="activateTeam(3, 'var(--team3)')"><h2>Team 3</h2><div class="score" id="score-3">0</div></div>
        </div>

        <div class="middle-panel">
            <div class="round-info" id="round-info">Round 1</div>
            <div class="prompt-box" id="ai-prompt">Loading Scenario...</div>
            <div class="input-container"><div class="input-box" id="team-input">Select a team to begin typing...</div></div>
            <div class="word-count" id="word-count-display">Word Count: <span id="word-counter">0</span> / 10</div>
        </div>

        <div class="side-panel right">
            <div class="team-card team4" id="team-4" onclick="activateTeam(4, 'var(--team4)')"><h2>Team 4</h2><div class="score" id="score-4">0</div></div>
            <div class="team-card team5" id="team-5" onclick="activateTeam(5, 'var(--team5)')"><h2>Team 5</h2><div class="score" id="score-5">0</div></div>
            <div class="team-card team6" id="team-6" onclick="activateTeam(6, 'var(--team6)')"><h2>Team 6</h2><div class="score" id="score-6">0</div></div>
        </div>
    </div>

    <div class="keyboard-panel" id="keyboard"></div>

    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-content">
            <h3>Confirm Submission</h3>
            <div style="font-size: 20px; color: #ccc;">Are you sure you want to send this sentence?</div>
            <div class="highlight-text" id="confirm-text">...</div>
            <button class="btn btn-yes" onclick="submitToAI()">Yes, Send! (Enter)</button>
            <button class="btn btn-no" onclick="closeModal('confirm-modal')">No, let me edit</button>
        </div>
    </div>

    <div class="modal-overlay" id="feedback-modal">
        <div class="modal-content">
            <h3 id="feedback-title">Grading...</h3>
            <div class="loader" id="ai-loader"></div>
            <h1 id="feedback-score" style="font-size: 65px; margin: 15px 0; display: none;">100</h1>
            <p id="feedback-text" style="display: none;">Lütfen bekleyin, dil bilgisi ve kelime sayısı kontrol ediliyor.</p>
            <button class="btn btn-next" id="next-team-btn" style="display: none; width: 100%;" onclick="finishTeamTurn()">Next Team (Enter)</button>
        </div>
    </div>

    <script>
        // Game State
        let activeTeamId = null;
        let activeTeamColor = null;
        let currentText = "";
        let round = 1;
        let teamsPlayedThisRound = [];
        let currentScenarioText = "";

        // The 50 A2-Level Scenarios
        const promptBank = [
            "A dog ate the student's homework.",
            "Someone stole a famous painting from the museum last night.",
            "The chef is cooking a delicious pizza in the kitchen.",
            "The school principal will announce the test results tomorrow.",
            "Shakespeare wrote 'Romeo and Juliet' many years ago.",
            "A strong storm destroyed the old bridge last night.",
            "The mechanic fixed my broken car this morning.",
            "Someone found a lost wallet in the school cafeteria.",
            "They will build a new hospital in our town soon.",
            "A famous director is making a new action movie.",
            "Alexander Fleming discovered penicillin in 1928.",
            "The postman delivers the mail every morning at 9 AM.",
            "Someone broke the classroom window during the break.",
            "They clean the school corridors every evening.",
            "Thomas Edison invented the lightbulb a long time ago.",
            "A local baker made this beautiful birthday cake.",
            "The police arrested the bank robbers yesterday.",
            "Someone painted the park benches green last week.",
            "Millions of people speak English around the world.",
            "They grow delicious oranges in Antalya.",
            "A famous architect designed this tall building.",
            "Someone feeds the zoo animals twice a day.",
            "The teacher will check our exams next week.",
            "They canceled the football match because of heavy rain.",
            "Someone left a mysterious package at the door.",
            "A mechanic is repairing the school bus right now.",
            "They will plant many new trees in the forest.",
            "Someone stole my bicycle from the garden yesterday.",
            "The baker sells hundreds of fresh breads every day.",
            "A loud noise woke up the baby last night.",
            "They organized a great party for the students.",
            "Someone took these beautiful photographs in Paris.",
            "The chef will prepare a special dinner tonight.",
            "They translate this popular book into many languages.",
            "A young girl found the missing dog in the park.",
            "They will open a new supermarket next month.",
            "Someone cleaned the whiteboard before the lesson started.",
            "The government built a new bridge over the river.",
            "A famous singer will sing the national anthem.",
            "They grow coffee beans in Brazil and Colombia.",
            "Someone locked the front door of the school.",
            "The doctor examined the patient carefully this morning.",
            "They serve breakfast from 7 AM to 10 AM.",
            "A rich man bought the expensive sports car.",
            "Someone invited all the students to the festival.",
            "They will release the new video game tomorrow.",
            "A talented artist painted this beautiful portrait.",
            "Someone left the lights on in the classroom.",
            "The company produces thousands of smartphones every day.",
            "They discovered an ancient city under the sea."
        ];

        // Initialization (Fires exactly when page loads)
        window.onload = function() {
            setRandomPrompt();
            generateKeyboard();
        };

        function setRandomPrompt() {
            let newPrompt = promptBank[Math.floor(Math.random() * promptBank.length)];
            while (newPrompt === currentScenarioText) {
                newPrompt = promptBank[Math.floor(Math.random() * promptBank.length)];
            }
            currentScenarioText = newPrompt;
            document.getElementById('ai-prompt').innerText = "Scenario: " + currentScenarioText;
        }

        function activateTeam(teamId, color) {
            if(teamsPlayedThisRound.includes(teamId)) {
                document.getElementById(`team-${teamId}`).style.transform = "translateX(10px)";
                setTimeout(() => document.getElementById(`team-${teamId}`).style.transform = "translateX(-10px)", 100);
                setTimeout(() => document.getElementById(`team-${teamId}`).style.transform = "translateX(0)", 200);
                return;
            }
            if(activeTeamId) {
                document.getElementById(`team-${activeTeamId}`).classList.remove('active');
            }
            activeTeamId = teamId;
            activeTeamColor = color;
            currentText = "";
            updateInputDisplay();
            document.getElementById(`team-${teamId}`).classList.add('active');
            document.body.style.boxShadow = `inset 0 0 150px ${color}`;
            document.getElementById('team-input').style.borderColor = color;
            
            if(window.innerWidth <= 900) {
                document.getElementById('team-input').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function generateKeyboard() {
            const layout = [
                ['q','w','e','r','t','y','u','i','o','p'],
                ['a','s','d','f','g','h','j','k','l'],
                ['z','x','c','v','b','n','m', '.', '?', '\'']
            ];
            const kbContainer = document.getElementById('keyboard');
            kbContainer.innerHTML = '';

            layout.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';
                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'key'; btn.innerText = key; btn.onclick = () => typeKey(key);
                    rowDiv.appendChild(btn);
                });
                kbContainer.appendChild(rowDiv);
            });

            const actionRow = document.createElement('div');
            actionRow.className = 'keyboard-row';
            actionRow.innerHTML = `
                <button class="key action" onclick="backspace()">⌫ Del</button>
                <button class="key space" onclick="typeKey(' ')">Space</button>
                <button class="key submit" onclick="openConfirmModal()">✔ Submit</button>
            `;
            kbContainer.appendChild(actionRow);
        }

        function typeKey(char) {
            if(!activeTeamId) return flashWarning();
            if (currentText.length === 0 && char.length === 1 && char !== ' ') {
                currentText += char.toUpperCase();
            } else { currentText += char; }
            updateInputDisplay();
        }

        function backspace() {
            if(!activeTeamId) return;
            currentText = currentText.slice(0, -1);
            updateInputDisplay();
        }

        function updateInputDisplay() {
            const inputBox = document.getElementById('team-input');
            inputBox.innerText = currentText === "" ? "" : currentText;
            
            const wordCount = currentText.trim() === "" ? 0 : currentText.trim().split(/\s+/).length;
            document.getElementById('word-counter').innerText = wordCount;
            const displayDiv = document.getElementById('word-count-display');
            
            if (wordCount === 10) displayDiv.className = "word-count perfect";
            else if (wordCount > 10) displayDiv.className = "word-count error";
            else displayDiv.className = "word-count";
        }

        function flashWarning() {
            const inputBox = document.getElementById('team-input');
            inputBox.style.borderColor = "#FF595E"; inputBox.style.color = "#FF595E";
            setTimeout(() => { inputBox.style.borderColor = "#444"; inputBox.style.color = "#111"; }, 300);
        }

        document.addEventListener('keydown', function(event) {
            const confirmOpen = document.getElementById('confirm-modal').style.display === 'flex';
            const feedbackOpen = document.getElementById('feedback-modal').style.display === 'flex';
            const aiIsThinking = document.getElementById('ai-loader').style.display === 'block';

            if (event.key === 'Enter') {
                if (confirmOpen) submitToAI();
                else if (feedbackOpen && !aiIsThinking) finishTeamTurn();
                else if (activeTeamId && !confirmOpen && !feedbackOpen) openConfirmModal();
                event.preventDefault(); return;
            }
            if (confirmOpen || feedbackOpen || !activeTeamId) return;
            if (event.key === 'Backspace') { backspace(); event.preventDefault(); }
            else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
                typeKey(event.key); if (event.key === ' ') event.preventDefault(); 
            }
        });

        function openConfirmModal() {
            if(!activeTeamId) return flashWarning();
            if(currentText.trim() === "") return;
            document.getElementById('confirm-text').innerText = `"${currentText}"`;
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function submitToAI() {
            closeModal('confirm-modal');
            
            document.getElementById('feedback-title').innerText = "Analyzing Grammar...";
            document.getElementById('feedback-title').style.color = "#ccc";
            document.getElementById('ai-loader').style.display = "block";
            document.getElementById('feedback-score').style.display = "none";
            document.getElementById('feedback-text').style.display = "none";
            document.getElementById('next-team-btn').style.display = "none";
            document.getElementById('feedback-modal').style.display = 'flex';

            const systemPrompt = `
                You are a strict but encouraging English teacher evaluating an A2-B1 level Turkish student.
                The scenario is: "${currentScenarioText}"

                Grade the student's entry based on these 3 rules:
                1. Does it make sense for the scenario?
                2. Is it EXACTLY 10 words? (Punctuation marks attached to words do not count as separate words).
                3. Is it written correctly in the PASSIVE VOICE?

                Give a score from 50 to 100. 
                CRITICAL: Provide the feedback entirely in TURKISH. 
                Write a detailed paragraph (3-4 sentences). 
                If they made a mistake, gently explain how the English passive voice is formed ("to be" yardımcı fiili + fiilin 3. hali / V3) so they can learn. Point out if they missed the 10-word limit. If they got 100, praise them in Turkish and explain why their grammar was perfect.

                You MUST reply ONLY with a valid JSON object:
                {"score": 85, "feedback": "Harika bir deneme! Ancak cümlen 10 kelime yerine 11 kelime olmuş. Ayrıca, İngilizcede edilgen yapı (passive voice) kurarken 'to be' yardımcı fiilini ve fiilin üçüncü halini (V3) kullanmalısın. Örneğin 'was stolen' demeliydin."}
            `;

            try {
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: currentText }
                        ],
                        model: 'openai', jsonMode: true, seed: Math.floor(Math.random() * 100000) 
                    })
                });

                const aiText = await response.text();
                const cleanJson = aiText.replace(/```json/g, '').replace(/```/g, '').trim(); 
                const aiResult = JSON.parse(cleanJson);
                showFeedbackUI(aiResult.score, aiResult.feedback);

            } catch (error) {
                console.error("AI Error:", error);
                showFeedbackUI(60, "Bağlantı hatası oluştu. Lütfen internet bağlantınızı kontrol edin. Oyun internet olmadan notlandırma yapamaz.");
            }
        }

        function showFeedbackUI(score, feedback) {
            document.getElementById('ai-loader').style.display = "none";
            const scoreElement = document.getElementById('feedback-score');
            scoreElement.style.display = "block"; scoreElement.innerText = score + " pts";
            
            const textElement = document.getElementById('feedback-text');
            textElement.style.display = "block"; textElement.innerText = feedback;
            document.getElementById('next-team-btn').style.display = "inline-block";
            
            const titleElement = document.getElementById('feedback-title');
            if (score === 100) {
                titleElement.innerText = "Mükemmel!"; titleElement.style.color = "#8AC926"; scoreElement.style.color = "#8AC926";
            } else if (score >= 80) {
                titleElement.innerText = "İyi İş!"; titleElement.style.color = "#FFCA3A"; scoreElement.style.color = "#FFCA3A";
            } else {
                titleElement.innerText = "Geliştirilmeli!"; titleElement.style.color = "#FF595E"; scoreElement.style.color = "#FF595E";
            }

            let currentScore = parseInt(document.getElementById(`score-${activeTeamId}`).innerText);
            document.getElementById(`score-${activeTeamId}`).innerText = currentScore + score;
        }

        function finishTeamTurn() {
            closeModal('feedback-modal');
            document.getElementById(`team-${activeTeamId}`).classList.add('played');
            document.getElementById(`team-${activeTeamId}`).classList.remove('active');
            teamsPlayedThisRound.push(activeTeamId);
            
            document.body.style.boxShadow = "none";
            document.getElementById('team-input').style.borderColor = "#444";
            currentText = ""; updateInputDisplay();
            document.getElementById('team-input').innerText = "Select next team...";
            activeTeamId = null;

            if(teamsPlayedThisRound.length === 6) setTimeout(nextRound, 1500);
        }

        function nextRound() {
            round++; document.getElementById('round-info').innerText = `Round ${round}`;
            teamsPlayedThisRound = [];
            for(let i=1; i<=6; i++) document.getElementById(`team-${i}`).classList.remove('played');
            setRandomPrompt();
        }
    </script>
</body>
</html>
