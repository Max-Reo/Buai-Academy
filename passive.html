<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passive Voice Challenge</title>
    <style>
        :root {
            --team1: #FF595E; /* Red */
            --team2: #1982C4; /* Blue */
            --team3: #8AC926; /* Green */
            --team4: #FFCA3A; /* Yellow */
            --team5: #6A4C93; /* Purple */
            --team6: #FF924C; /* Orange */
            --bg-color: #1e1e24;
            --text-light: #f5f5f5;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
            user-select: none;
        }

        /* Main Layout */
        .game-container {
            display: flex;
            height: 65vh;
            padding: 20px 40px;
            box-sizing: border-box;
            gap: 20px;
        }

        .side-panel {
            width: 20%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
        }

        .middle-panel {
            width: 60%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            text-align: center;
        }

        /* Team Cards */
        .team-card {
            background: #333;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s, opacity 0.3s;
            border: 3px solid transparent;
            opacity: 0.6;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .team-card h2 { margin: 0 0 5px 0; font-size: 22px; }
        .team-card .score { font-size: 32px; font-weight: bold; }
        .team-card:hover { transform: scale(1.03); opacity: 0.9;}

        .team1 { border-color: var(--team1); color: var(--team1); }
        .team2 { border-color: var(--team2); color: var(--team2); }
        .team3 { border-color: var(--team3); color: var(--team3); }
        .team4 { border-color: var(--team4); color: var(--team4); }
        .team5 { border-color: var(--team5); color: var(--team5); }
        .team6 { border-color: var(--team6); color: var(--team6); }

        .team-card.active {
            transform: scale(1.05);
            opacity: 1;
            box-shadow: 0 0 20px currentColor;
            background: #222;
        }

        .team-card.played {
            opacity: 0.2;
            pointer-events: none;
            filter: grayscale(80%);
        }

        /* Middle Section UI */
        .round-info {
            font-size: 20px;
            color: #aaa;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .prompt-box {
            background: #2b2b36;
            padding: 20px 30px;
            border-radius: 8px;
            font-size: 24px;
            margin-bottom: 20px;
            width: 100%;
            border-left: 6px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            line-height: 1.4;
        }

        .input-container {
            width: 100%;
            position: relative;
        }

        .input-box {
            width: 100%;
            min-height: 70px;
            background: #fff;
            color: #111;
            font-size: 28px;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-wrap: break-word;
            box-sizing: border-box;
            border: 5px solid #444;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.2);
            transition: border-color 0.3s;
        }

        .word-count {
            margin-top: 15px;
            font-size: 18px;
            color: #aaa;
            font-weight: bold;
        }

        .word-count.perfect { color: #8AC926; }
        .word-count.error { color: #FF595E; }

        /* Keyboard Panel */
        .keyboard-panel {
            height: 35vh;
            background-color: #25252d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
            border-top: 5px solid #111;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }

        .key {
            background: #444;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 22px;
            margin: 0 4px;
            font-size: 22px;
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
            box-shadow: 0 4px 0 #222;
        }

        .key:hover { background: #666; }
        .key:active { transform: translateY(4px); box-shadow: 0 0 0 #222; }
        
        .key.space { width: 400px; }
        .key.action { background: #d9534f; width: 120px; box-shadow: 0 4px 0 #9c2a27; }
        .key.action:active { box-shadow: 0 0 0 #9c2a27; }
        .key.submit { background: #5cb85c; width: 140px; font-weight: bold; box-shadow: 0 4px 0 #3d8b3d; }
        .key.submit:active { box-shadow: 0 0 0 #3d8b3d; }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #2b2b36;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 750px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 2px solid #555;
        }

        .modal-content h3 { font-size: 32px; margin-top: 0; color: #fff; }
        .modal-content .highlight-text { font-size: 28px; color: #FFCA3A; margin: 25px 0; font-style: italic; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px;}
        
        .btn {
            padding: 15px 30px;
            font-size: 22px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.95); }
        .btn-yes { background: #5cb85c; color: white; }
        .btn-no { background: #d9534f; color: white; }
        .btn-next { background: #1982C4; color: white; }

        /* Loading Spinner */
        .loader {
            border: 6px solid #444;
            border-top: 6px solid #FFCA3A;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="game-container">
        <div class="side-panel left">
            <div class="team-card team1" id="team-1" onclick="activateTeam(1, 'var(--team1)')">
                <h2>Team 1</h2>
                <div class="score" id="score-1">0</div>
            </div>
            <div class="team-card team2" id="team-2" onclick="activateTeam(2, 'var(--team2)')">
                <h2>Team 2</h2>
                <div class="score" id="score-2">0</div>
            </div>
            <div class="team-card team3" id="team-3" onclick="activateTeam(3, 'var(--team3)')">
                <h2>Team 3</h2>
                <div class="score" id="score-3">0</div>
            </div>
        </div>

        <div class="middle-panel">
            <div class="round-info" id="round-info">Round 1</div>
            <div class="prompt-box" id="ai-prompt">
                Loading Scenario...
            </div>
            <div class="input-container">
                <div class="input-box" id="team-input">Select a team to begin typing...</div>
            </div>
            <div class="word-count" id="word-count-display">Word Count: <span id="word-counter">0</span> / 10</div>
        </div>

        <div class="side-panel right">
            <div class="team-card team4" id="team-4" onclick="activateTeam(4, 'var(--team4)')">
                <h2>Team 4</h2>
                <div class="score" id="score-4">0</div>
            </div>
            <div class="team-card team5" id="team-5" onclick="activateTeam(5, 'var(--team5)')">
                <h2>Team 5</h2>
                <div class="score" id="score-5">0</div>
            </div>
            <div class="team-card team6" id="team-6" onclick="activateTeam(6, 'var(--team6)')">
                <h2>Team 6</h2>
                <div class="score" id="score-6">0</div>
            </div>
        </div>
    </div>

    <div class="keyboard-panel" id="keyboard">
        </div>

    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-content">
            <h3>Confirm Submission</h3>
            <div style="font-size: 20px; color: #ccc;">Are you sure you want to send this sentence?</div>
            <div class="highlight-text" id="confirm-text">...</div>
            <button class="btn btn-yes" onclick="submit()">Yes, Send! (Enter)</button>
            <button class="btn btn-no" onclick="closeModal('confirm-modal')">No, let me edit</button>
        </div>
    </div>

    <div class="modal-overlay" id="feedback-modal">
        <div class="modal-content">
            <h3 id="feedback-title">Grading...</h3>
            <div class="loader" id="ai-loader"></div>
            <h1 id="feedback-score" style="font-size: 65px; margin: 15px 0; display: none;">100</h1>
            <p id="feedback-text" style="color: white; font-size: 22px; line-height: 1.5;">Please wait while we analyze the grammar and word count.</p>
            <button class="btn btn-next" id="next-team-btn" style="display: none;" onclick="finishTeamTurn()">Next Team (Enter)</button>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let activeTeamId = null;
        let activeTeamColor = null;
        let currentText = "";
        let round = 1;
        let teamsPlayedThisRound = [];
        
        // --- SCENARIOS (A2 Level) ---
        const prompts = [
            "Scenario: A dog ate the student's homework. Describe this using passive voice.",
            "Scenario: Someone stole a famous painting from the museum last night. Describe this.",
            "Scenario: The chef is cooking a delicious pizza in the kitchen right now.",
            "Scenario: The school principal will announce the test results tomorrow morning.",
            "Scenario: Shakespeare wrote 'Romeo and Juliet' many years ago in England.",
            "Scenario: The mechanic has finally fixed my broken car today."
        ];

        // --- INITIALIZATION ---
        document.getElementById('ai-prompt').innerText = prompts[0];
        generateKeyboard();

        // --- 1. TEAM SELECTION ---
        function activateTeam(teamId, color) {
            if(teamsPlayedThisRound.includes(teamId)) {
                // Team already played this round
                document.getElementById(`team-${teamId}`).style.transform = "translateX(10px)";
                setTimeout(() => document.getElementById(`team-${teamId}`).style.transform = "translateX(-10px)", 100);
                setTimeout(() => document.getElementById(`team-${teamId}`).style.transform = "translateX(0)", 200);
                return;
            }

            // Deactivate previous
            if(activeTeamId) {
                document.getElementById(`team-${activeTeamId}`).classList.remove('active');
            }

            activeTeamId = teamId;
            activeTeamColor = color;
            currentText = "";
            updateInputDisplay();

            // Visual Updates
            document.getElementById(`team-${teamId}`).classList.add('active');
            document.body.style.boxShadow = `inset 0 0 150px ${color}`;
            document.getElementById('team-input').style.borderColor = color;
        }

        // --- 2. KEYBOARD & INPUT LOGIC ---
        function generateKeyboard() {
            const layout = [
                ['q','w','e','r','t','y','u','i','o','p'],
                ['a','s','d','f','g','h','j','k','l'],
                ['z','x','c','v','b','n','m', '.', '?', '\'']
            ];
            
            const kbContainer = document.getElementById('keyboard');
            kbContainer.innerHTML = '';

            layout.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';
                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'key';
                    btn.innerText = key;
                    btn.onclick = () => typeKey(key);
                    rowDiv.appendChild(btn);
                });
                kbContainer.appendChild(rowDiv);
            });

            // Action Row
            const actionRow = document.createElement('div');
            actionRow.className = 'keyboard-row';
            actionRow.innerHTML = `
                <button class="key action" onclick="backspace()">⌫ Del</button>
                <button class="key space" onclick="typeKey(' ')">Space</button>
                <button class="key submit" onclick="openConfirmModal()">✔ Submit</button>
            `;
            kbContainer.appendChild(actionRow);
        }

        function typeKey(char) {
            if(!activeTeamId) return flashWarning();
            
            // Auto-capitalize first letter
            if (currentText.length === 0 && char.length === 1 && char !== ' ') {
                currentText += char.toUpperCase();
            } else {
                currentText += char;
            }
            updateInputDisplay();
        }

        function backspace() {
            if(!activeTeamId) return;
            currentText = currentText.slice(0, -1);
            updateInputDisplay();
        }

        function updateInputDisplay() {
            const inputBox = document.getElementById('team-input');
            if (currentText === "") {
                inputBox.innerText = "";
            } else {
                inputBox.innerText = currentText;
            }
            
            // Word Count Logic
            const wordCount = currentText.trim() === "" ? 0 : currentText.trim().split(/\s+/).length;
            const counterSpan = document.getElementById('word-counter');
            const displayDiv = document.getElementById('word-count-display');
            
            counterSpan.innerText = wordCount;
            
            if (wordCount === 10) {
                displayDiv.className = "word-count perfect";
            } else if (wordCount > 10) {
                displayDiv.className = "word-count error";
            } else {
                displayDiv.className = "word-count";
            }
        }

        function flashWarning() {
            const inputBox = document.getElementById('team-input');
            inputBox.style.borderColor = "#FF595E";
            inputBox.style.color = "#FF595E";
            setTimeout(() => {
                inputBox.style.borderColor = "#444";
                inputBox.style.color = "#111";
            }, 300);
        }

        // --- PHYSICAL KEYBOARD INTEGRATION ---
        document.addEventListener('keydown', function(event) {
            const confirmOpen = document.getElementById('confirm-modal').style.display === 'flex';
            const feedbackOpen = document.getElementById('feedback-modal').style.display === 'flex';
            const aiIsThinking = document.getElementById('ai-loader').style.display === 'block';

            if (event.key === 'Enter') {
                if (confirmOpen) {
                    submitToAI();
                } else if (feedbackOpen && !aiIsThinking) {
                    finishTeamTurn();
                } else if (activeTeamId && !confirmOpen && !feedbackOpen) {
                    openConfirmModal();
                }
                event.preventDefault();
                return;
            }

            if (confirmOpen || feedbackOpen || !activeTeamId) return;

            if (event.key === 'Backspace') {
                backspace();
                event.preventDefault(); 
            } else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
                typeKey(event.key);
                if (event.key === ' ') event.preventDefault(); 
            }
        });

        // --- 3. MODALS ---
        function openConfirmModal() {
            if(!activeTeamId) return flashWarning();
            if(currentText.trim() === "") return;
            
            document.getElementById('confirm-text').innerText = `"${currentText}"`;
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // --- 4. REAL AI INTEGRATION (POLLINATIONS API) ---
        async function submitToAI() {
            closeModal('confirm-modal');
            
            // Set UI to Loading State
            document.getElementById('feedback-title').innerText = "Grading...";
            document.getElementById('feedback-title').style.color = "#ccc";
            document.getElementById('ai-loader').style.display = "block";
            document.getElementById('feedback-score').style.display = "none";
            document.getElementById('next-team-btn').style.display = "none";
            document.getElementById('feedback-text').innerText = "Analyzing grammar, context, and word count...";
            document.getElementById('feedback-modal').style.display = 'flex';

            const currentPrompt = document.getElementById('ai-prompt').innerText;

            const systemPrompt = `
                You are a strict but encouraging English teacher for A2-B1 students.
                The scenario is: "${currentPrompt}"

                Grade the student's entry based on these 3 rules:
                1. Does it make sense for the scenario?
                2. Is it EXACTLY 10 words? (Deduct points if it is not exactly 10 words. Punctuation marks attached to words do not count as separate words).
                3. Is it written correctly in the PASSIVE VOICE?

                Give a score from 50 to 100. 
                If the score is not 100, provide 1 or 2 short sentences of simple A2-level English feedback explaining why. If it is 100, say "Perfect job! Great use of the passive voice."

                CRITICAL: You must reply ONLY with a valid JSON object in this exact format:
                {"score": 85, "feedback": "Your sentence is in the passive voice, but you used 11 words instead of 10."}
            `;

            try {
                // Fetch to Pollinations Free Endpoint
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: currentText }
                        ],
                        model: 'openai', 
                        jsonMode: true,  
                        seed: Math.floor(Math.random() * 100000) 
                    })
                });

                const aiText = await response.text();
                
                // Parse JSON safely
                const cleanJson = aiText.replace(/```json/g, '').replace(/```/g, '').trim(); 
                const aiResult = JSON.parse(cleanJson);

                // Show Results
                showFeedbackUI(aiResult.score, aiResult.feedback);

            } catch (error) {
                console.error("AI Error:", error);
                // Fallback in case of school wifi drop or API timeout
                showFeedbackUI(60, "Connection error!");
            }
        }

        function showFeedbackUI(score, feedback) {
            // Hide Loader, Show Score
            document.getElementById('ai-loader').style.display = "none";
            
            const scoreElement = document.getElementById('feedback-score');
            scoreElement.style.display = "block";
            scoreElement.innerText = score + " pts";
            
            document.getElementById('feedback-text').innerText = feedback;
            document.getElementById('next-team-btn').style.display = "inline-block";
            
            // Color coding based on score
            const titleElement = document.getElementById('feedback-title');
            if (score === 100) {
                titleElement.innerText = "Perfect!";
                titleElement.style.color = "#8AC926";
                scoreElement.style.color = "#8AC926";
            } else if (score >= 80) {
                titleElement.innerText = "Good Job!";
                titleElement.style.color = "#FFCA3A";
                scoreElement.style.color = "#FFCA3A";
            } else {
                titleElement.innerText = "Needs Work!";
                titleElement.style.color = "#FF595E";
                scoreElement.style.color = "#FF595E";
            }

            // Update Global Team Score
            let currentScore = parseInt(document.getElementById(`score-${activeTeamId}`).innerText);
            document.getElementById(`score-${activeTeamId}`).innerText = currentScore + score;
        }

        // --- 5. ROUND MANAGEMENT ---
        function finishTeamTurn() {
            closeModal('feedback-modal');
            
            // Mark team as played
            document.getElementById(`team-${activeTeamId}`).classList.add('played');
            document.getElementById(`team-${activeTeamId}`).classList.remove('active');
            teamsPlayedThisRound.push(activeTeamId);
            
            // Reset Middle Area
            document.body.style.boxShadow = "none";
            document.getElementById('team-input').style.borderColor = "#444";
            currentText = "";
            updateInputDisplay();
            document.getElementById('team-input').innerText = "Select next team...";
            activeTeamId = null;

            // Check if all 6 teams went
            if(teamsPlayedThisRound.length === 6) {
                setTimeout(nextRound, 1500);
            }
        }

        function nextRound() {
            round++;
            if (round > prompts.length) {
                document.getElementById('ai-prompt').innerText = "GAME OVER! Look at the final scores!";
                document.getElementById('round-info').innerText = "Final Results";
                document.getElementById('team-input').innerText = "Great job everyone!";
                return;
            }

            // Setup Next Round
            document.getElementById('round-info').innerText = `Round ${round}`;
            document.getElementById('ai-prompt').innerText = prompts[round - 1];
            teamsPlayedThisRound = [];

            // Reactivate all team buttons visually
            for(let i=1; i<=6; i++) {
                document.getElementById(`team-${i}`).classList.remove('played');
            }
        }
    </script>
</body>
</html>
