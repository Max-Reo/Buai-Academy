<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>5th Gym: Natsuki Subaru</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: GBA tactics screen — map stage left, status windows right; stacks on phones. Single committed dark "night-blue window" look. */
:root{
  --ink:#0a0f2c; --night:#111947; --deep:#16215c;
  --win1:#3053c4; --win2:#18297c; --rim:#efe2b0; --rim2:#7e6a32;
  --text:#f6f3e8; --muted:#b4bde3; --dim:#7f89bf;
  --blue:#3f86ff; --red:#f04d43; --purple:#a95ff2; --gold:#ffd166; --green:#5ad47f;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(1200px 600px at 70% -10%,#26307a 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#2a1150 0,transparent 60%);
  background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
.screen{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;box-sizing:border-box}
.win{background:linear-gradient(180deg,var(--win1),var(--win2));border:3px solid var(--rim);border-radius:7px;
  box-shadow:inset 0 0 0 2px var(--rim2),0 5px 0 rgba(0,0,0,.35)}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.btn{font-family:var(--f-display);font-size:16px;cursor:pointer;border:2px solid var(--rim);border-radius:6px;padding:8px 16px;
  background:linear-gradient(180deg,#4a6ee0,#22379a);color:var(--text);box-shadow:0 3px 0 #0b1340}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1340}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btn.gold{background:linear-gradient(180deg,#ffdf86,#d8a536);color:#2b1c00;border-color:#fff3c9}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--dim)}
.btn.sm{font-size:13px;padding:4px 10px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=text],input[type=password],input[type=url],textarea,select{background:#0c1440;border:2px solid #5b6cb8;border-radius:5px;padding:8px 10px;width:100%;box-sizing:border-box}
textarea{resize:vertical;min-height:90px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Title ---------- */
#scr-title{display:grid;place-items:center}
.title-card{max-width:680px;width:100%;padding:28px;display:grid;gap:18px;text-align:left}
.title-card h1{font-size:clamp(34px,7vw,64px);line-height:1;color:var(--gold);text-shadow:3px 3px 0 #3a1d00,0 0 24px rgba(255,209,102,.25)}
.title-card .sub{font-family:var(--f-display);font-size:18px;color:var(--rim)}
.badge-dots{display:flex;gap:8px}
.badge-dots i{width:18px;height:18px;border-radius:50%;background:#26307a;border:2px solid var(--rim2)}
.badge-dots i.on{background:radial-gradient(circle at 35% 35%,#fff6c8,#e0a92e);border-color:var(--rim)}
.badge-dots i.cur{background:radial-gradient(circle at 35% 35%,#e5c8ff,#7a2fd0);border-color:var(--rim);box-shadow:0 0 12px var(--purple)}

/* ---------- Setup ---------- */
#scr-setup{display:grid;place-items:start center}
.setup{max-width:860px;width:100%;padding:22px;display:grid;gap:18px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-family:var(--f-display);font-size:12px;padding:3px 8px;border-radius:4px;background:#0c1440;color:var(--dim);border:1px solid #2b3a85}
.steps span.on{background:var(--gold);color:#2b1c00;border-color:var(--gold)}
.steps span.done{color:var(--green);border-color:#2c7a4a}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.field{display:grid;gap:6px;min-width:0}
.drop{display:grid;place-items:center;gap:6px;border:2px dashed #6a7bd0;border-radius:8px;min-height:150px;padding:10px;cursor:pointer;text-align:center;background:#0c1440}
.drop img{max-height:180px;border-radius:6px}
.statgrid{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px 10px;align-items:center}
.statgrid .bar{height:10px;background:#0c1440;border-radius:5px;overflow:hidden;min-width:60px}
.statgrid .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#9cc2ff)}
.statgrid .bar b.ex{background:linear-gradient(90deg,var(--gold),#fff0b8)}
.pm{display:flex;gap:4px}
.pm button{width:28px;height:28px;border-radius:5px;border:2px solid var(--rim2);background:#22379a;cursor:pointer;font-family:var(--f-display)}
.pm button:disabled{opacity:.35;cursor:not-allowed}
.movechip{display:grid;gap:2px;padding:8px 10px;border-radius:6px;background:#0c1440;border-left:6px solid var(--c,#888);min-width:0}
.movechip b{font-family:var(--f-display);font-weight:600}
.movechip small{color:var(--muted)}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.mon-card{display:grid;gap:6px;padding:12px;border-radius:8px;background:#0c1440;border:2px solid #2b3a85}
.mon-card img{width:72px;height:72px;object-fit:contain;border-radius:6px;background:#16215c}
.spin{display:inline-block;width:14px;height:14px;border:3px solid var(--rim);border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#ffb3ad}

/* ---------- Game ---------- */
#scr-game{display:grid;grid-template-rows:auto 1fr;gap:12px;padding-block:12px}
.hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px}
.hud h2{font-size:20px;color:var(--gold)}
.hud .obj{flex:1;min-width:200px;color:var(--text);font-size:14px}
.phase{font-family:var(--f-display);font-size:14px;padding:3px 10px;border-radius:4px;background:#0c1440}
.phase.blue{color:#9cc2ff}.phase.red{color:#ff9d97}.phase.purple{color:#d9b6ff}
.play{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
@media (max-width:980px){.play{grid-template-columns:minmax(0,1fr)}}
.mapwrap{position:relative;border:3px solid var(--rim);border-radius:7px;box-shadow:inset 0 0 0 2px var(--rim2),0 5px 0 rgba(0,0,0,.35);overflow:hidden;background:#000;min-width:0}
#map{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:pointer;touch-action:manipulation}
.side{display:grid;gap:10px;min-width:0}
.panel{padding:10px 12px;display:grid;gap:6px;min-width:0}
.ucard{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}
.ucard img{width:64px;height:64px;object-fit:contain;border-radius:6px;background:#0c1440}
.ucard .nm{font-family:var(--f-display);font-size:17px;line-height:1.1}
.hpbar{height:8px;background:#0c1440;border-radius:4px;overflow:hidden}
.hpbar b{display:block;height:100%;background:var(--green);transition:width .35s}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px;font-size:13px}
.mini span{display:flex;justify-content:space-between;gap:4px}
.mini span i{font-style:normal;color:var(--muted)}
.log{max-height:180px;overflow:auto;font-size:13px;display:grid;gap:3px}
.log div{border-left:3px solid #2b3a85;padding-left:6px}
.log .b{border-color:var(--blue)}.log .r{border-color:var(--red)}.log .p{border-color:var(--purple)}.log .s{border-color:var(--gold)}
#actmenu{position:absolute;min-width:140px;padding:6px;display:grid;gap:2px;z-index:5}
#actmenu button{font-family:var(--f-display);font-size:16px;text-align:left;background:transparent;border:0;padding:6px 10px;border-radius:4px;cursor:pointer}
#actmenu button:hover,#actmenu button:focus-visible{background:rgba(255,255,255,.15)}
#actmenu button:disabled{opacity:.4;cursor:not-allowed}
#actmenu .sub{font-family:var(--f-body);font-size:12px;color:var(--muted);display:block}
#actmenu .hint{font-size:12px;color:var(--muted);padding:2px 10px}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,6,20,.72);display:grid;place-items:center;z-index:50;padding:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{max-width:620px;width:100%;max-height:calc(100vh - 40px);overflow:auto;padding:18px;display:grid;gap:12px}
.modal h2{color:var(--gold);font-size:24px}
.fc{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 12px;align-items:center;text-align:center;font-family:var(--f-display);font-size:17px}
.fc .k{color:var(--gold);font-size:13px}
.fc .nm{font-size:18px}
.fc .bl{color:#9cc2ff}.fc .rd{color:#ff9d97}.fc .pu{color:#d9b6ff}
.slot{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:8px;border-radius:6px;background:#0c1440}
.slot img{width:64px;height:64px;object-fit:contain;border-radius:6px;background:#16215c}

/* ---------- Banner ---------- */
#banner{position:fixed;left:0;right:0;top:40%;z-index:60;pointer-events:none;display:grid;place-items:center}
#banner div{font-family:var(--f-display);font-size:clamp(28px,6vw,54px);font-weight:700;padding:10px 0;width:100%;text-align:center;
  letter-spacing:.1em;animation:ban 1.2s ease forwards;text-shadow:3px 3px 0 rgba(0,0,0,.5)}
@keyframes ban{0%{transform:translateX(-100%);opacity:0}20%{transform:none;opacity:1}80%{transform:none;opacity:1}100%{transform:translateX(100%);opacity:0}}

/* ---------- Battle scene ---------- */
#battle .bbox{max-width:820px;width:100%;padding:10px;display:grid;gap:8px}
#bcv{width:100%;height:auto;display:block;border-radius:4px;background:#000}
.bpanels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bp{padding:8px 10px;border-radius:6px;display:grid;gap:4px;min-width:0}
.bp.blue{background:linear-gradient(180deg,#2c5fd6,#163788)}
.bp.red{background:linear-gradient(180deg,#c33a33,#6d1a17)}
.bp.purple{background:linear-gradient(180deg,#7d3cc9,#3c1670)}
.bp .nm{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp .st{display:flex;gap:10px;font-size:13px;flex-wrap:wrap}
.bp .hpn{font-family:var(--f-display);font-size:20px}
.bmove{font-family:var(--f-display);text-align:center;font-size:18px;color:var(--gold);min-height:24px}

#chestOv .bbox{max-width:820px;width:100%;padding:10px;display:grid;gap:8px}
#ccv{width:100%;height:auto;display:block;border-radius:4px;background:#000}
.cvwrap{position:relative}
.die{position:absolute;left:50%;top:4px;transform:translateX(-50%);background:none;border:0;padding:0;display:grid;justify-items:center;gap:2px;cursor:pointer;color:var(--text)}
.die canvas{width:clamp(64px,14vw,112px);height:clamp(64px,14vw,112px);filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.die:focus-visible{outline:none}
.die:focus-visible canvas{filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.die.wait canvas{animation:diepulse 1s ease-in-out infinite}
@keyframes diepulse{50%{transform:scale(1.08) rotate(-6deg)}}
.die-t{font-family:var(--f-display);font-size:15px;background:rgba(8,12,40,.78);padding:2px 10px;border-radius:5px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.die-t.hit{color:var(--gold)}.die-t.miss{color:#b4bde3}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;font-family:var(--f-display);font-size:18px}
.lvl .up{color:var(--gold)}
/* ---------- Visual novel ---------- */
#vn{position:fixed;inset:0;z-index:70;background:linear-gradient(180deg,rgba(6,8,30,.55),rgba(6,8,30,.92));display:grid;grid-template-rows:1fr auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.vn-stage{position:relative;min-height:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;max-width:1000px;width:100%;margin:0 auto}
.vn-sprite{width:min(42vw,360px);height:min(56vh,440px);display:flex;align-items:flex-end;justify-content:center;transition:transform .3s ease,filter .3s ease;transform-origin:bottom center;filter:brightness(.5) saturate(.7)}
.vn-sprite img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.vn-sprite.speak{transform:scale(1.15);filter:none;z-index:2}
.vn-sprite.flash{animation:vnflash 1.6s ease}
@keyframes vnflash{0%{filter:brightness(1)}30%{filter:brightness(4) saturate(0)}60%{filter:brightness(4) saturate(0)}100%{filter:brightness(1)}}
.vn-box{max-width:1000px;width:100%;margin:0 auto;padding:14px 18px 16px;display:grid;gap:8px;position:relative;cursor:pointer;box-sizing:border-box}
.vn-name{position:absolute;top:-18px;left:16px;font-family:var(--f-display);font-size:17px;padding:2px 14px;border-radius:5px;background:var(--gold);color:#2b1c00;border:2px solid #fff3c9}
.vn-name:empty{display:none}
.vn-text{font-size:18px;min-height:3.2em;white-space:pre-wrap}
.vn-text.nar{font-style:italic;color:var(--muted)}
.vn-next{position:absolute;right:14px;bottom:8px;color:var(--gold);animation:bob 0.8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}
.vn-form{display:grid;gap:8px;cursor:default}
.vn-form textarea{min-height:64px;font-size:16px}
.vn-left-tag,.vn-right-tag{font-family:var(--f-display)}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

</div>

<div id="banner" hidden></div>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const Store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const MOVES = {};
MOVE_SRC.trim().split('\n').forEach(line => {
  line = line.trim(); if (!line) return;
  let sig = false; if (line[0] === '*') { sig = true; line = line.slice(1); }
  const [name, type, cat, pow, acc, mn, mx, anim] = line.split('|');
  MOVES[name] = { name, type, cat: cat === 'P' ? 'phys' : 'spec', pow: +pow, acc: +acc, min: +mn, max: +mx, anim, sig };
});
const TYPES = Object.keys(TYPE_COL);
const PLAYER_MOVES = Object.values(MOVES).filter(m => !m.sig).map(m => m.name);
const moveLine = m => `${m.type} · ${m.cat === 'phys' ? 'Physical' : 'Special'} · Pow ${m.pow} · Acc ${m.acc > 0 ? '+' : ''}${m.acc} · Range ${m.min === m.max ? m.min : m.min + '–' + m.max}`;
function findMove(name) {
  if (!name) return null;
  if (MOVES[name]) return name;
  const n = String(name).toLowerCase().replace(/[^a-z]/g, '');
  return PLAYER_MOVES.find(m => m.toLowerCase().replace(/[^a-z]/g, '') === n) || null;
}

function freeTileNear(x, y, u) {
  const seen = new Set([K(x, y)]); const q = [[x, y]];

    const [cx, cy] = q.shift();
    if (inMap(cx, cy) && tileCost(u, cx, cy) < 99 && !unitAt(cx, cy)) return [cx, cy];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = cx + dx, ny = cy + dy; if (inMap(nx, ny) && !seen.has(K(nx, ny))) { seen.add(K(nx, ny)); q.push([nx, ny]); } }
  }

}
function spawnUnit(def, team, x, y) {

}
async function endPlayerPhase() {

async function aiPhase(team) {

async function rabbitsMultiply() {
  const rabbits = alive('purple'); let budget = Math.min(3, 10 - rabbits.length); let n = 0;
  for (const r of shuffle(rabbits)) {
    if (budget <= 0) break;
    const c = spawnUnit(BOSSES.rabbit, 'purple', r.x, r.y);

  }
  if (n) { await banner('THE GREAT RABBIT MULTIPLIES!', '#a95ff2'); log(`${n} more Great Rabbit${n > 1 ? 's' : ''} appear (${alive('purple').length} on the field).`, 'p'); }

async function aiAct(u) {
  const targets = G.units.filter(v => v.hp > 0 && canInitiate(u, v));
  const R = reachable(u);
  let best = null;
  for (const [k] of R.costs) {
    const [x, y] = k.split(',').map(Number);
    for (const t of targets) {
      const r = Math.abs(t.x - x) + Math.abs(t.y - y); if (r > 2) continue;
      for (const n of u.moves) {
        const m = MOVES[n]; if (r < m.min || r > m.max) continue;
        const ox = u.x, oy = u.y; u.x = x; u.y = y; const f = forecast(u, t, m); u.x = ox; u.y = oy;
        const mult = f.aDouble ? 2 : 1;
        const exp = f.cA.dmg * f.cA.hit / 100 * mult;
        const kill = f.cA.dmg * mult >= t.hp ? 12 : 0;
        const back = f.cD ? f.cD.dmg * f.cD.hit / 100 * (f.dDouble ? 2 : 1) : 0;

  if (!goals.length) return;
  let pickT = null, pv = Infinity;

    const [x, y] = k.split(',').map(Number);

    const v = Math.abs(dmin - keep) * 3 - terrAt(x, y).ac * .5 + (keep ? Math.random() * .8 : 0);

async function moveUnit(u, x, y, R) {

    }

}

let S = null;
function startSetup() {
  S = { step: 0, trainer: { name: '', img: '' }, mons: [0, 1, 2, 3].map(i => ({ species: '', nick: '', img: '', story: '', moves: ['', ''], types: ['', ''], growth: null, base: null, extra: Object.fromEntries(STAT_KEYS.map(k => [k, 0])), blurb: '', loading: false, err: '' })) };
  showScreen('setup'); renderSetup();
}
const STEP_NAMES = ['Trainer', 'Pokémon 1', 'Pokémon 2', 'Pokémon 3', 'Well Pokémon', 'Review'];
function renderSetup() {
  $('#steps').innerHTML = STEP_NAMES.map((n, i) => `<span class="${i === S.step ? 'on' : i < S.step ? 'done' : ''}">${n}</span>`).join('');
  const body = $('#setupBody');
  if (S.step === 0) return stepTrainer(body);
  if (S.step >= 1 && S.step <= 4) return stepMon(body, S.step - 1);
  return stepReview(body);
}
function dropField(id, label, src, req) {
  return `<div class="field"><label class="lbl" for="${id}">${label}${req ? '' : ' (optional)'}</label>
    <label class="drop" for="${id}">${src ? `<img src="${esc(src)}" alt="">` : ''}<span class="muted">${src ? 'Click to change' : 'Click to upload an image'}</span></label>
    <input type="file" id="${id}" accept="image/*" hidden></div>`;
}
function stepTrainer(body) {
  body.innerHTML = `<h2>Who is challenging Subaru?</h2>
    <div class="grid2"><div class="stack"><div class="field"><label class="lbl" for="trName">Trainer name</label><input type="text" id="trName" maxlength="32" value="${esc(S.trainer.name)}" placeholder="e.g. Rin"></div>
      <p class="muted">Your trainer picture appears on the right side of every conversation. Your trainer does not walk on the map.</p></div>
      ${dropField('trImg', 'Trainer picture', S.trainer.img, true)}</div>
    <div class="err" id="trErr"></div>
    <div class="row" style="justify-content:space-between"><button class="btn ghost" type="button" id="bk">Title</button><button class="btn gold" type="button" id="nx">Next</button></div>`;
  const nx = $('#nx'); const upd = () => nx.disabled = !(S.trainer.name.trim() && S.trainer.img);
  $('#trName').oninput = e => { S.trainer.name = e.target.value; upd(); };
  $('#trImg').onchange = async e => { try { S.trainer.img = await fileToDataURL(e.target.files[0], 420); renderSetup(); } catch (er) { $('#trErr').textContent = er.message; } };
  $('#bk').onclick = showTitle; nx.onclick = () => { S.step = 1; renderSetup(); }; upd();
}
function stepMon(body, i) {
  const M = S.mons[i]; const special = i === 3;
  const moveOpts = (sel) => `<option value="">Choose a move…</option>` + Object.keys(TYPE_COL).map(t => { const ms = PLAYER_MOVES.filter(n => MOVES[n].type === t); return ms.length ? `<optgroup label="${t}">${ms.map(n => `<option value="${esc(n)}" ${n === sel ? 'selected' : ''}>${esc(n)} — ${MOVES[n].cat === 'phys' ? 'Phys' : 'Spec'} · Pow ${MOVES[n].pow} · Acc ${MOVES[n].acc > 0 ? '+' : ''}${MOVES[n].acc} · Rng ${MOVES[n].min === MOVES[n].max ? MOVES[n].min : MOVES[n].min + '–' + MOVES[n].max}</option>`).join('')}</optgroup>` : ''; }).join('');
  const spent = sumStats(M.extra);
  body.innerHTML = `<h2>${special ? 'Your Well Pokémon (4th slot)' : 'Pokémon ' + (i + 1)}</h2>
    ${special ? '<p class="muted">The Faerie Well gave you this custom Pokémon long ago, then made the world forget. Its art and story decide how it can evolve in Chapter 2.</p>' : '<p class="muted">Type a species and an optional nickname. The game spreads 40 stat points to fit it and suggests two moves and its types; change any of them, then add 10 points yourself.</p>'}
    <div class="grid2">
      <div class="stack">
        <div class="field"><label class="lbl" for="sp">Species</label><input type="text" id="sp" maxlength="40" value="${esc(M.species)}" placeholder="${special ? 'e.g. Lanternwisp (your own species)' : 'e.g. Lucario'}"></div>
        <div class="field"><label class="lbl" for="nk">Nickname (optional)</label><input type="text" id="nk" maxlength="24" value="${esc(M.nick)}"></div>
        <div class="grid2"><div class="field"><label class="lbl" for="ty1">Type</label><select id="ty1">${typeOpts(M.types[0], false)}</select></div><div class="field"><label class="lbl" for="ty2">Second type</label><select id="ty2">${typeOpts(M.types[1], true)}</select></div></div>
        <div class="field"><label class="lbl" for="mv1">Move 1</label><select id="mv1">${moveOpts(M.moves[0])}</select></div><div class="field"><label class="lbl" for="mv2">Move 2</label><select id="mv2">${moveOpts(M.moves[1])}</select></div>
        <div class="muted" style="font-size:12px">Flying and Water types can cross water; Flying types glide over mountains; only Rock, Ground and Flying types can climb High Peaks.</div>
      </div>
      ${dropField('mimg', special ? 'Art for this Pokémon' : (M.artAuto ? 'Art (from PokeAPI)' : 'Art — leave empty to use PokeAPI art'), M.img, special)}
    </div>
    ${special ? `<div class="field"><label class="lbl" for="story">Its story</label><textarea id="story" maxlength="1200" placeholder="How did you two meet? What has it been through? What does it care about?">${esc(M.story)}</textarea></div>` : ''}
    <div class="row"><button class="btn" type="button" id="build">${M.base ? 'Rebuild stats' : 'Build stats'}</button>${M.loading ? '<span class="spin"></span><span class="muted">Thinking…</span>' : ''}<span class="err">${esc(M.err)}</span></div>
    <div id="built"></div>
    <div class="row" style="justify-content:space-between"><button class="btn ghost" type="button" id="bk">Back</button><button class="btn gold" type="button" id="nx">Next</button></div>`;
  const nx = $('#nx');
  const ready = () => M.species.trim() && M.base && sumStats(M.extra) === 10 && M.moves.length === 2 && M.moves.every(Boolean) && M.moves[0] !== M.moves[1] && M.types[0] && (!special || (M.img && M.story.trim()));
  const upd = () => { nx.disabled = !ready(); $('#build').disabled = M.loading || !M.species.trim() || (special && !M.story.trim()); };
  $('#sp').oninput = e => { M.species = e.target.value; upd(); };
  $('#nk').oninput = e => { M.nick = e.target.value; };
  $('#mimg').onchange = async e => { try { M.img = await fileToDataURL(e.target.files[0], 420); M.artAuto = false; M.err = ''; renderSetup(); } catch (er) { M.err = er.message; renderSetup(); } };
  if (special) {
    $('#story').oninput = e => { M.story = e.target.value; upd(); };
  }
  $('#mv1').onchange = e => { M.moves[0] = e.target.value; upd(); };
  $('#mv2').onchange = e => { M.moves[1] = e.target.value; upd(); };
  $('#ty1').onchange = e => { M.types[0] = e.target.value; upd(); };
  $('#ty2').onchange = e => { M.types[1] = e.target.value; };
  $('#build').onclick = async () => {
    M.loading = true; M.err = ''; renderSetup();
    const artP = (!special && (!M.img || M.artAuto)) ? fetchPokeArt(M.species.trim()) : Promise.resolve(null);
    const r = await aiBuild(M.species.trim(), M.nick.trim(), special ? M.story.trim() : '', !special || !M.moves.every(Boolean), special && M.img ? await toDataURL(M.img) : null);
    const art = await artP;
    if (art) { M.img = art; M.artAuto = true; } else if (M.artAuto) { M.img = ''; M.artAuto = false; }
    M.loading = false; M.base = r.stats; M.blurb = r.blurb; M.growth = r.growth;
    if (r.moves.length === 2 && (!special || !M.moves.every(Boolean))) M.moves = r.moves;
    if (r.types.length) M.types = [r.types[0], r.types[1] || ''];
    M.extra = Object.fromEntries(STAT_KEYS.map(k => [k, 0]));
    if (r.offline) M.err = 'Stats were spread automatically this time. You can rebuild to try again.';
    renderSetup();
  };
  $('#bk').onclick = () => { S.step--; renderSetup(); };
  nx.onclick = () => { S.step++; renderSetup(); };
  if (M.base) renderBuilt($('#built'), M, special, upd);
  upd();
}
function typeOpts(sel, optional) {
  return (optional ? '<option value="">— none —</option>' : '<option value="">Choose a type…</option>') + TYPES.map(t => `<option value="${t}" ${t === sel ? 'selected' : ''}>${t}</option>`).join('');
}
function renderBuilt(el, M, special, upd) {
  const spent = sumStats(M.extra);
  const tot = k => M.base[k] + M.extra[k];
  el.innerHTML = `<div class="win panel" style="background:#0c1440;box-shadow:none;border-width:2px">
    ${M.blurb ? `<div style="font-style:italic">${esc(M.blurb)}</div>` : ''}
    <div class="row" style="justify-content:space-between"><div class="lbl">Stats: 40 suggested + your 10</div><div class="tnum"><b>${10 - spent}</b> points left</div></div>
    <div class="statgrid tnum">${STAT_KEYS.map(k => `<b>${STAT_LABEL[k]}</b><div class="bar" style="display:flex"><b style="width:${M.base[k] * 6}%"></b><b class="ex" style="width:${M.extra[k] * 6}%"></b></div><span>${M.base[k]}${M.extra[k] ? ' +' + M.extra[k] : ''} = ${tot(k)}</span><span class="muted">${k === 'hp' ? (10 + 2 * tot(k)) + ' HP' : k === 'spe' ? 'Move ' + (5 + Math.floor(tot(k) / 5)) : ''}</span><span class="pm"><button type="button" data-k="${k}" data-d="-1" ${M.extra[k] ? '' : 'disabled'} aria-label="Remove a point from ${STAT_LABEL[k]}">−</button><button type="button" data-k="${k}" data-d="1" ${spent < 10 ? '' : 'disabled'} aria-label="Add a point to ${STAT_LABEL[k]}">+</button></span>`).join('')}</div>
    <div class="grid2">${M.moves.filter(Boolean).map(n => { const m = MOVES[n]; return `<div class="movechip" style="--c:${TYPE_COL[m.type]}"><b>${esc(n)}</b><small>${moveLine(m)}</small></div>`; }).join('')}</div>
    <div class="muted" style="font-size:12px">Each level up raises stats using hidden growth rates set for this Pokémon.</div>
  </div>`;
  $$('button[data-k]', el).forEach(b => b.onclick = () => { const k = b.dataset.k, d = +b.dataset.d; M.extra[k] = clamp(M.extra[k] + d, 0, 10); renderBuilt(el, M, special, upd); upd(); });
}
async function aiBuild(species, nick, story, needMoves, img) {
  const sys = 'You design Pokémon units for a Fire Emblem-style tactics game.';
  const user = `Species: ${species}\nNickname: ${nick || '(none)'}\n${story ? 'Backstory: ' + story.slice(0, 900) + '\n' : ''}Distribute EXACTLY 40 points across these stats so they mirror this Pokémon's real base-stat spread and personality: hp (each point = 2 HP), atk, def, spa (special attack), spd (special defense), spe (speed), skl (skill: accuracy and crits). Each value from 1 to 12.${needMoves ? `\nAlso choose exactly 2 attacking moves this Pokémon would plausibly use, ONLY from this list: ${PLAYER_MOVES.join(', ')}. Match its types and its stronger attacking side (physical vs special). Pick somewhat randomly among the fitting moves.` : ''}\nAlso give its 1-2 Pokémon types (from: ${TYPES.join(', ')}).\nAlso set hidden level-up growth rates in percent for each stat, fitting this Pokémon. Budget rule: hp growth counts DOUBLE, so 2×hp + atk + def + spa + spd + spe + skl must equal exactly 300 (e.g. hp 30 uses 60 of the budget). Each value 0-100.\nJSON shape: {"stats":{"hp":0,"atk":0,"def":0,"spa":0,"spd":0,"spe":0,"skl":0}${needMoves ? ',"moves":["",""]' : ''},"types":["",""],"growth":{"hp":0,"atk":0,"def":0,"spa":0,"spd":0,"spe":0,"skl":0},"blurb":"one fun sentence about how it fights"}`;
  let j = null; try { j = await AI.json(sys, [{ role: 'user', content: user + (img ? '\nThe attached picture is this Pokémon\'s art; use it too.' : '') }], { image: img }); } catch (e) {}
  const out = { stats: null, moves: [], types: [], growth: null, blurb: '', offline: false };
  if (j && j.stats) out.stats = normStats(j.stats, 40);
  else { out.offline = true; out.stats = normStats(weightedStats(40, { hp: 2, atk: 1, def: 1, spa: 1, spd: 1, spe: 1, skl: 1 }, { hp: 2, atk: 1.5, def: 1.2, spa: 1.5, spd: 1.2, spe: 1.3, skl: 1 }), 40); }
  if (needMoves) {
    const ms = ((j && j.moves) || []).map(findMove).filter(Boolean);
    while (ms.length < 2) { const m = pick(PLAYER_MOVES); if (!ms.includes(m)) ms.push(m); }
    out.moves = ms.slice(0, 2);
    if (out.moves[0] === out.moves[1]) out.moves[1] = pick(PLAYER_MOVES.filter(m => m !== out.moves[0]));
  }
  out.blurb = (j && j.blurb) || '';
  out.types = ((j && j.types) || []).map(t => TYPES.find(x => x.toLowerCase() === String(t).toLowerCase().trim())).filter(Boolean).slice(0, 2);
  out.growth = j && j.growth ? normGrowth(j.growth, out.stats) : fallbackGrowth(out.stats);
  return out;
}
function normStats(s, total) {
  const o = {}; STAT_KEYS.forEach(k => o[k] = clamp(Math.round(+(s && s[k]) || 0), 1, 14));
  let sum = sumStats(o);
  while (sum > total) { const k = STAT_KEYS.reduce((a, c) => o[c] > o[a] ? c : a); o[k]--; sum--; }
  while (sum < total) { const k = STAT_KEYS.reduce((a, c) => o[c] + Math.random() * 3 > o[a] + Math.random() * 3 ? c : a); o[k]++; sum++; }
  return o;
}
function monCardHTML(d) {
  const name = d.nick || d.species; const sp = d.evolved ? d.evolved.name : d.species;
  const img = d.img || monogram(name, 'blue');
  return `<div class="mon-card"><div class="row"><img src="${esc(img)}" alt=""><div style="min-width:0"><b style="font-family:var(--f-display);font-size:17px">${esc(name)}</b><div class="muted" style="font-size:13px">${esc(sp)}${d.types && d.types.length ? ' · ' + d.types.map(esc).join('/') : ''}${d.is4 ? ' · Well Pokémon' : ''} · Lv ${d.level || 1}</div></div></div>
    <div class="mini tnum">${STAT_KEYS.map(k => `<span><i>${STAT_LABEL[k]}</i>${d.stats[k]}</span>`).join('')}<span><i>HP</i>${10 + 2 * d.stats.hp}</span></div>
    <div class="muted" style="font-size:13px">${d.moves.map(esc).join(' · ')}</div></div>`;
}
function stepReview(body) {
  const team = S.mons.map((M, i) => { const stats = Object.fromEntries(STAT_KEYS.map(k => [k, M.base[k] + M.extra[k]])); return { species: M.species.trim(), nick: M.nick.trim(), img: M.img || '', story: M.story.trim(), moves: [...M.moves], types: M.types.filter(Boolean), stats, growth: M.growth || fallbackGrowth(stats), level: 1, exp: 0, is4: i === 3 }; });
  body.innerHTML = `<h2>Ready, ${esc(S.trainer.name)}?</h2>
    <div class="row"><img src="${esc(S.trainer.img)}" alt="" style="width:80px;height:80px;object-fit:contain;border-radius:8px;background:#0c1440"><p class="muted" style="flex:1;min-width:200px">Five chapters against Natsuki Subaru. Your Pokémon fully heal between chapters. Your progress is saved in this browser.</p></div>
    <div class="roster">${team.map(monCardHTML).join('')}</div>
    <div class="row" style="justify-content:space-between"><button class="btn ghost" type="button" id="bk">Back</button><button class="btn gold" type="button" id="go">Enter the 5th Gym</button></div>`;
  $('#bk').onclick = () => { S.step--; renderSetup(); };
  $('#go').onclick = () => {
    RUN = { trainer: { ...S.trainer, name: S.trainer.name.trim() }, team, chapter: 1, flags: {} };
    if (!saveRun()) log && console.warn('Could not save (storage full or blocked).');
    showChapterIntro(1);
  };
}

async function openGameMenu() {
  if (!G || G.busy) return;
