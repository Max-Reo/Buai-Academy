<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌲 Forest Mushroom Hunt AI</title>
    <style>
        :root {
            --bg-color: #1a2f1a;
            --text-color: #e0f2e0;
            --card-bg: #2d4a2d;
            --accent: #76c476;
            --mushroom-color: #ffcc66;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #3d5e3d;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin-top: 0;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .mushroom-icon {
            color: var(--mushroom-color);
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #142414;
            color: white;
            font-size: 1rem;
        }

        button {
            padding: 12px 20px;
            background-color: var(--accent);
            color: #0f2b0f;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #8ce08c;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
            transform: none;
        }

        #log {
            height: 300px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .entry {
            padding: 10px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }

        .entry.user {
            background: rgba(255,255,255,0.05);
            border-left: 3px solid var(--accent);
        }

        .entry.ai {
            background: rgba(0,0,0,0.3);
            border-left: 3px solid var(--mushroom-color);
        }

        .loading {
            text-align: center;
            font-style: italic;
            opacity: 0.7;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🌲 Forest Treasure Hunt</h1>
    
    <div class="stats-bar">
        <span>🍄 Basket: <span id="score">0</span></span>
        <span>Turn: <span id="turn">1</span></span>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="E.g., I search inside the hollow oak tree..." autocomplete="off">
        <button id="searchBtn">Search</button>
    </div>

    <div id="loading" class="loading">The forest spirits are judging your strategy...</div>
    <div id="log">
        <div class="entry ai">
            Welcome, seeker. The forest is dense. Tell me exactly where you look to find the hidden mushrooms. Creativity is rewarded!
        </div>
    </div>
</div>

<script>
    const searchBtn = document.getElementById('searchBtn');
    const userInput = document.getElementById('userInput');
    const log = document.getElementById('log');
    const scoreDisplay = document.getElementById('score');
    const turnDisplay = document.getElementById('turn');
    const loading = document.getElementById('loading');

    let totalMushrooms = 0;
    let turnCount = 1;

    // Helper to add text to the game log
    function addLog(text, type) {
        const div = document.createElement('div');
        div.className = `entry ${type}`;
        div.innerHTML = text; // allow bolding with HTML tags from AI
        log.prepend(div);
    }

    async function handleSearch() {
        const query = userInput.value.trim();
        if (!query) return;

        // UI Updates
        userInput.value = '';
        searchBtn.disabled = true;
        loading.style.display = 'block';
        addLog(`<strong>You searched:</strong> ${query}`, 'user');

        try {
            // 1. Construct the Prompt for the AI
            // We ask for JSON strictly to make parsing easier.
            const systemPrompt = `
                You are a Dungeon Master for a mushroom hunting game.
                The player describes a location: "${query}".
                
                Evaluate their search strategy based on creativity and logic.
                1. If the search is lazy (e.g., "I look on ground"), give 1-3 mushrooms.
                2. If the search is creative/smart (e.g., "I lift the mossy rock near the stream"), give 4-10 mushrooms.
                
                Return ONLY a valid JSON object in this format (no other text):
                {
                    "mushrooms": <integer between 1 and 10>,
                    "message": "<short, atmospheric description of what they found and why>"
                }
            `;

            // 2. Call the Free Pollinations.AI API
            // Note: We use a random seed to prevent caching
            const seed = Math.floor(Math.random() * 10000);
            const encodedPrompt = encodeURIComponent(systemPrompt);
            const url = `https://text.pollinations.ai/${encodedPrompt}?seed=${seed}&json=true`;

            const response = await fetch(url);
            
            // Pollinations sometimes returns raw text even if we ask for JSON,
            // so we treat the response as text first, then try to parse it.
            const rawText = await response.text();
            
            let data;
            try {
                // Try to find JSON pattern in the response (sometimes AI adds chatter)
                const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    data = JSON.parse(jsonMatch[0]);
                } else {
                    throw new Error("No JSON found");
                }
            } catch (e) {
                // Fallback if AI fails to output JSON
                console.warn("AI JSON parse failed, using fallback.", rawText);
                data = {
                    mushrooms: Math.floor(Math.random() * 5) + 1,
                    message: "The forest is silent... but you manage to scrounge up some fungi. (AI formatting error, fallback used)"
                };
            }

            // 3. Update Game State
            const count = parseInt(data.mushrooms) || 0;
            totalMushrooms += count;
            turnCount++;

            // 4. Update UI
            scoreDisplay.textContent = totalMushrooms;
            turnDisplay.textContent = turnCount;
            
            const flavorText = `<strong>+${count} 🍄</strong><br>${data.message}`;
            addLog(flavorText, 'ai');

        } catch (error) {
            addLog(`❌ Connection to the forest spirit lost. Check your internet.`, 'ai');
            console.error(error);
        } finally {
            searchBtn.disabled = false;
            loading.style.display = 'none';
            userInput.focus();
        }
    }

    // Event Listeners
    searchBtn.addEventListener('click', handleSearch);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSearch();
    });
</script>

</body>
</html>
